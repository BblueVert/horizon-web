<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guía de bienvenida — {{CLIENTE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Guía de bienvenida: A4 por página, portada oscura de marca y páginas claras (tokens de la landing 2026). */
:root {
  --bg: #FFFBF6; --bg2: #FFF4EA; --ink: #1A1626; --ink2: #4B4659; --ink3: #8C8799; --line: #EDE4DA;
  --acc: #F2690C; --rose: #E8637A; --lilac: #7B3FA0; --peach: #FFE3CC; --mint: #DDF3EA;
  --grad: linear-gradient(90deg, #F2690C, #E8637A, #7B3FA0);
  --font-d: 'Bebas Neue', 'Arial Narrow', sans-serif;
  --font-m: 'DM Mono', ui-monospace, monospace;
  --font-b: 'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif;
}
@page { size: A4; margin: 0; }
* { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body { margin: 0; background: #E9E3DC; color: var(--ink); font: 10.5pt/1.6 var(--font-b); }
.page { width: 210mm; min-height: 297mm; padding: 22mm 20mm 18mm; background: var(--bg); position: relative; break-after: page; overflow: hidden; }
.page:last-child { break-after: auto; }
@media screen { .page { margin: 24px auto; box-shadow: 0 4px 30px rgba(26,22,38,.12); } }
@media screen and (max-width: 820px) { .page { width: 100%; min-height: auto; padding: 32px 18px; margin: 0 0 12px; } }

/* Portada */
.cover { background: radial-gradient(120% 70% at 85% 105%, rgba(242,105,12,.55), transparent 60%), radial-gradient(90% 60% at 10% 100%, rgba(232,99,122,.45), transparent 60%), linear-gradient(160deg, #1E1744 0%, #34276E 45%, #5A2F8C 100%); color: #FAFAFF; display: flex; flex-direction: column; justify-content: space-between; }
.cover .logo { width: 62mm; height: auto; display: block; }
.cover .kicker { font: 500 9pt/1 var(--font-m); letter-spacing: .14em; text-transform: uppercase; opacity: .75; margin-bottom: 10px; }
.cover h1 { font: 64pt/.92 var(--font-d); letter-spacing: .01em; margin: 0 0 14px; }
.cover .para { font-size: 14pt; font-weight: 500; opacity: .92; margin: 0; }
.cover .pie { display: flex; justify-content: space-between; font: 8.5pt/1.5 var(--font-m); opacity: .7; border-top: 1px solid rgba(250,250,255,.25); padding-top: 10px; }

/* Páginas interiores */
.top { display: flex; justify-content: space-between; align-items: center; font: 500 8pt/1 var(--font-m); letter-spacing: .1em; text-transform: uppercase; color: var(--ink3); margin-bottom: 16mm; }
.top .num { color: var(--acc); }
h2 { font: 40pt/.95 var(--font-d); margin: 0 0 6px; letter-spacing: .01em; }
.bajada { color: var(--ink2); font-size: 11.5pt; margin: 0 0 12mm; max-width: 140mm; }
h3 { font: 700 11pt/1.3 var(--font-b); margin: 18px 0 6px; }
p { margin: 0 0 9px; }
ul { margin: 0 0 10px; padding-left: 18px; } li { margin-bottom: 4px; }
.firma-carta { margin-top: 14mm; font-weight: 600; }
.firma-carta span { display: block; font: 400 9pt/1.4 var(--font-m); color: var(--ink3); }
.cita { border-left: 3px solid var(--acc); background: var(--bg2); padding: 12px 16px; border-radius: 0 10px 10px 0; font-size: 12pt; font-style: italic; margin: 8px 0 14px; }

.datos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 0 14px; }
.dato { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.dato .k { font: 500 7.5pt/1.2 var(--font-m); letter-spacing: .1em; text-transform: uppercase; color: var(--ink3); margin-bottom: 4px; }
.dato .v { font-weight: 700; font-size: 12pt; }
.dato.ancho { grid-column: 1 / -1; }

.linea { list-style: none; padding: 0; margin: 0; position: relative; }
.linea::before { content: ''; position: absolute; left: 13px; top: 6px; bottom: 6px; width: 2px; background: var(--grad); border-radius: 2px; }
.linea li { position: relative; padding: 0 0 12px 42px; margin: 0; break-inside: avoid; }
.linea li .n { position: absolute; left: 0; top: 0; width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: #fff; font: 500 9pt/28px var(--font-m); text-align: center; }
.linea li strong { display: block; font-size: 11pt; }
.linea li .cuando { font: 500 8pt/1.4 var(--font-m); color: var(--acc); text-transform: uppercase; letter-spacing: .06em; }
.linea li p { margin: 2px 0 0; color: var(--ink2); }

.check { list-style: none; padding: 0; margin: 0 0 12px; }
.check li { display: flex; gap: 10px; padding: 9px 12px; background: #fff; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 6px; break-inside: avoid; }
.check li::before { content: ''; flex: 0 0 14px; height: 14px; margin-top: 3px; border: 1.5px solid var(--ink2); border-radius: 4px; }
.check li span { color: var(--ink3); font-size: 9pt; display: block; }

.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.card { border-radius: 14px; padding: 14px 16px; break-inside: avoid; }
.card.p { background: var(--peach); } .card.m { background: var(--mint); } .card.l { background: #EBE1F5; } .card.r { background: #FBE0E5; }
.card strong { display: block; margin-bottom: 4px; }
.card p { margin: 0; font-size: 9.5pt; color: var(--ink2); }

table { width: 100%; border-collapse: collapse; margin: 4px 0 14px; font-size: 9.5pt; background: #fff; border-radius: 12px; overflow: hidden; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 500 7.5pt/1.3 var(--font-m); text-transform: uppercase; letter-spacing: .08em; color: var(--ink3); background: var(--bg2); }
td.monto { text-align: right; white-space: nowrap; font-weight: 600; }

.faq h3 { margin-top: 12px; }
.portal { background: var(--ink); color: #FAFAFF; border-radius: 16px; padding: 18px 20px; margin: 6px 0 14px; }
.portal .k { font: 500 8pt/1 var(--font-m); letter-spacing: .1em; text-transform: uppercase; opacity: .6; margin-bottom: 8px; }
.portal a { color: #FFB27A; font: 600 12pt/1.3 var(--font-m); word-break: break-all; text-decoration: none; }
.pasos { counter-reset: p; list-style: none; padding: 0; }
.pasos li { counter-increment: p; display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; border-bottom: 1px solid var(--line); }
.pasos li::before { content: counter(p); font: 34pt/.9 var(--font-d); background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; min-width: 26px; }
.pasos li strong { display: block; font-size: 12pt; }
.pendiente { background: #FFF1E8; color: #B4441A; padding: 0 3px; border-radius: 3px; font-family: var(--font-m); font-size: 8.5pt; }
.pie-pag { position: absolute; left: 20mm; right: 20mm; bottom: 10mm; display: flex; justify-content: space-between; font: 7.5pt/1 var(--font-m); color: var(--ink3); }
@media screen and (max-width: 820px) { .pie-pag { position: static; margin-top: 20px; } .datos, .cards { grid-template-columns: 1fr; } .cover h1 { font-size: 48pt; } }
</style>
</head>
