<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>Manual de identidad</title>
<!--
  Plantilla HORIZON · Manual de identidad, versión PyME (16:9, 1920 × 1080).
  Estándar: ESTRATEGIA/HORIZON-ENTREGABLES-DE-MARCA.md · Estructura: ../../estructuras/manual-identidad.md
  No se edita a mano por cliente: los datos van en <carpeta>/marca.js y se arma con
  node scripts/marca-pdf.js <carpeta>   → <carpeta>/manual-identidad.html + .pdf
  El marco (crema, tinta, naranja, superficie profunda, Plus Jakarta Sans + DM Mono) es de HORIZON.
  El color y la letra del cliente aparecen solo dentro de los ejemplos.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<!--FUENTES_CLIENTE-->
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
:root{
  --bg:#FFFBF6;--bg2:#FFF4EA;--ink:#1A1626;--ink2:#5F5970;--ink3:#9C96AB;--line:#F0E7DC;--line2:#E6DACB;
  --peach:#FFE2CC;--rose:#FFDDE5;--lilac:#ECE3FF;--mint:#DDF5E6;--acc:#F2690C;--rose-i:#C4467A;--violet:#7B3FA0;
  --grad:linear-gradient(95deg,#F2690C 0%,#C4467A 55%,#7B3FA0 100%);
  --deep:radial-gradient(95% 80% at 86% 124%,rgba(251,227,150,.62) 0%,rgba(242,105,12,.62) 22%,rgba(204,50,83,.48) 42%,rgba(123,63,160,.12) 62%,rgba(90,47,140,0) 74%),linear-gradient(135deg,#1E1744 0%,#34276E 52%,#5A2F8C 100%);
  --sans:'Plus Jakarta Sans',system-ui,sans-serif;--mono:'DM Mono',ui-monospace,monospace;
}
@page{size:1920px 1080px;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#D9D2C8}
body{font-family:var(--sans);color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
@media print{html,body{background:none}.pg{margin:0!important;box-shadow:none!important}}
.pg{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg);margin:0 auto 40px;page-break-after:always;break-after:page;box-shadow:0 10px 40px rgba(26,22,38,.12)}
.pg:last-child{page-break-after:auto;break-after:auto}
.pg.dark{background:var(--deep);color:#fff}
svg.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* encabezado y pie */
.hd{position:absolute;left:96px;right:96px;top:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;font:500 13px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.hd .cap{color:var(--ink)}
.hd .doc{letter-spacing:.08em;text-transform:none;font-family:var(--sans);font-weight:600;font-size:14px;color:var(--ink2)}
.hd .mi{display:flex;gap:22px;justify-content:flex-end}
.hd .mi .on{color:var(--acc)}
.ft{position:absolute;left:96px;right:96px;bottom:40px;border-top:1px solid var(--line2);padding-top:14px;display:flex;justify-content:space-between;font:500 13px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.ft b{color:var(--ink);font-weight:500}
.dark .hd,.dark .ft{color:rgba(255,255,255,.55)}.dark .ft{border-color:rgba(255,255,255,.18)}.dark .ft b,.dark .hd .cap{color:#fff}

/* retícula de contenido: 1/3 texto + 2/3 visual */
.body{position:absolute;left:96px;right:96px;top:120px;bottom:96px;display:grid;grid-template-columns:repeat(12,1fr);column-gap:24px}
.txt{grid-column:1/5;display:flex;flex-direction:column;padding-top:40px;padding-right:24px}
.vis{grid-column:5/13;display:flex;align-items:center;justify-content:center;min-height:0}
.vis.top{align-items:flex-start;padding-top:40px}
.num{display:flex;align-items:baseline;gap:16px;margin-bottom:28px}
.num b{font:500 64px/1 var(--mono);color:var(--acc);letter-spacing:-.02em}
.num span{font:500 14px/1.2 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink2)}
.txt h2{font-weight:800;font-size:54px;line-height:1.04;letter-spacing:-.035em;margin-bottom:24px;text-wrap:balance}
.txt p{font-size:20px;line-height:1.55;color:var(--ink2);margin-bottom:16px;text-wrap:pretty}
.txt p strong{color:var(--ink);font-weight:700}
.lbl{font:500 13px/1.3 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.lbl.acc{color:var(--acc)}
.g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* espacios de imagen: con ruta muestra la imagen; sin ruta, el código para el prompt */
.ph{background:var(--bg2) center/cover no-repeat;border-radius:20px;overflow:hidden;position:relative}
.ph.empty{border:2px dashed var(--line2);display:flex;flex-direction:column;justify-content:flex-end;padding:24px;gap:8px;background:repeating-linear-gradient(135deg,var(--bg2) 0 18px,#FFEFE0 18px 36px)}
.ph.empty b{font:500 20px/1 var(--mono);color:var(--acc);letter-spacing:.06em}
.ph.empty span{font-size:15px;line-height:1.4;color:var(--ink2);max-width:420px}
.dark .ph.empty,.ph.empty.on-dark{border-color:rgba(255,255,255,.28);background:repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 18px,rgba(255,255,255,.02) 18px 36px)}
.dark .ph.empty span,.ph.empty.on-dark span{color:rgba(255,255,255,.7)}

/* marcas ✓ / ✕ */
.mk{display:inline-flex;width:34px;height:34px;border-radius:50%;align-items:center;justify-content:center;flex:none}
.mk svg{width:20px;height:20px;stroke-width:2.4}
.mk.ok{background:var(--acc);color:#fff}.mk.no{background:var(--ink);color:#fff}
.cap-row{display:flex;gap:14px;align-items:flex-start;margin-top:16px}
.cap-row h4{font-size:19px;font-weight:700;margin-bottom:4px}
.cap-row p{font-size:16px;line-height:1.45;color:var(--ink2)}

/* tarjetas y tiles */
.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:32px}
.tile{border-radius:20px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.tile.ink{background:var(--ink)}.tile.deep{background:var(--deep)}.tile.cream{background:var(--bg2);border:1px solid var(--line2)}
.tile img{display:block;max-width:76%;max-height:60%}
.grid{display:grid;gap:24px;width:100%}

/* portada */
.cover .logo{position:absolute;top:150px;left:50%;transform:translateX(-50%);width:560px}
.cover .bg{background-color:transparent!important;position:absolute;inset:0;opacity:.85;mix-blend-mode:lighten;border-radius:0;-webkit-mask-image:linear-gradient(90deg,transparent 28%,#000 60%);mask-image:linear-gradient(90deg,transparent 28%,#000 60%)}
.cover .bg.empty{opacity:1;mix-blend-mode:normal;border:0;background:none;justify-content:flex-start;padding:0}
.cover .bg.empty b{position:absolute;top:44px;right:96px;font-size:14px}
.cover .bg.empty span{display:none}
.cover .t{position:absolute;left:96px;bottom:96px}
.cover .t .lbl{color:rgba(255,255,255,.6);margin-bottom:24px}
.cover h1{font-weight:800;font-size:150px;line-height:.92;letter-spacing:-.045em;max-width:1100px}
.cover .meta{position:absolute;right:96px;bottom:104px;text-align:right;font:500 18px/1.7 var(--mono);letter-spacing:.08em;color:rgba(255,255,255,.75)}
.cover .meta i{font-style:normal;color:var(--acc);padding:0 10px}

/* índice */
.idx h1{position:absolute;left:96px;top:120px;font-weight:800;font-size:150px;letter-spacing:-.05em;line-height:.9}
.idx .cols{position:absolute;left:96px;right:96px;bottom:150px;display:grid;grid-template-columns:repeat(4,1fr)}
.idx .col{border-left:1px solid var(--line2);padding:0 32px;min-height:400px}
.idx .col:first-child{border-left:0;padding-left:0}
.idx .it{margin-bottom:34px}
.idx .it b{display:block;font:500 15px/1 var(--mono);color:var(--acc);margin-bottom:10px}
.idx .it h3{font-size:30px;font-weight:800;letter-spacing:-.025em;margin-bottom:8px}
.idx .it p{font-size:15px;line-height:1.5;color:var(--ink3)}

/* separador */
.sep .name{position:absolute;left:96px;top:120px;max-width:980px}
.sep .name .lbl{color:rgba(255,255,255,.6);margin-bottom:20px}
.sep .name h1{font-weight:800;font-size:150px;line-height:.9;letter-spacing:-.05em}
.sep .secs{position:absolute;left:96px;top:520px;font-size:24px;line-height:1.9;color:rgba(255,255,255,.85)}
.sep .secs b{font:500 18px var(--mono);color:var(--acc);display:inline-block;width:70px}
.sep .ph{position:absolute;right:96px;top:72px;width:640px;height:600px;border-radius:28px}
.sep .big{position:absolute;right:96px;bottom:64px;font:800 300px/.8 var(--sans);letter-spacing:-.06em}
.sep .dots{position:absolute;left:96px;bottom:96px;display:flex;gap:12px}
.sep .dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5)}
.sep .dots i.on{background:var(--acc);border-color:var(--acc)}

/* impacto */
.imp .q{position:absolute;left:96px;right:300px;top:240px;font-weight:800;font-size:112px;line-height:1;letter-spacing:-.045em;text-wrap:balance}
.imp .sub{position:absolute;left:96px;bottom:130px;width:1100px;display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:start}
.imp .sub p{font-size:21px;line-height:1.55;color:var(--ink2)}

/* piezas escaladas */
.sc{position:relative;flex:none}
.sc>.in{position:absolute;left:0;top:0;transform-origin:0 0}
.specs{margin-top:auto;border-top:1px solid var(--line2)}
.specs div{display:grid;grid-template-columns:140px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px}
.specs dt{font:500 12px/1.6 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.specs dd{color:var(--ink);font-weight:600}

/* cierre */
.end .logo{position:absolute;left:96px;top:120px;width:420px}
.end h1{position:absolute;left:96px;top:360px;font-weight:800;font-size:100px;line-height:.96;letter-spacing:-.045em;max-width:1000px}
.end .lines{position:absolute;left:96px;bottom:140px;font:500 22px/1.9 var(--mono);color:rgba(255,255,255,.85)}
.end .sello{position:absolute;right:96px;bottom:140px;text-align:right;font:500 14px/1.8 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55)}
</style>
</head>
<body>
<!--SPRITE-->
<!--MARCA-->
<div id="doc"></div>
<script>
(function(){
const M = window.MARCA;
if(!M){document.body.innerHTML='<p style="padding:40px;font:20px sans-serif">Falta marca.js. Arma el manual con: node scripts/marca-pdf.js &lt;carpeta&gt;</p>';return;}
const IM = M.imagenes || {};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ico = id => `<svg class="ico" aria-hidden="true"><use href="#${id}"/></svg>`;
const OK = `<span class="mk ok">${ico('i-check')}</span>`, NO = `<span class="mk no">${ico('i-x')}</span>`;
const DOC = M.documento || 'Manual de identidad';
const VER = (M.version || '').split('·')[0].trim();
const logoDark = M.logo.fondo_obligatorio === 'oscuro';

/* Espacios de imagen. El código (IMG-NN) es el mismo del archivo de prompts. */
const SLOTS = {
  'IMG-01':'Portada · ilustración de fondo, horizonte en degradado',
  'IMG-02':'Separador 1 · Esencia · el cliente principal en su negocio',
  'IMG-03':'Separador 2 · Logo · ilustración del símbolo',
  'IMG-04':'Separador 3 · Color · objetos reales en la paleta',
  'IMG-05':'Separador 4 · Tipografía · letras impresas en uso',
  'IMG-06':'Separador 5 · Voz · conversación de WhatsApp',
  'IMG-07':'Separador 6 · Fotografía · foto con el celular',
  'IMG-08':'Separador 7 · Aplicaciones · piezas sobre la mesa',
  'IMG-09':'Separador 8 · Archivos · ilustración de carpetas',
  'IMG-10':'Retrato del cliente principal',
  'IMG-11':'Referencia de estilo · negocio de la zona',
  'IMG-12':'Referencia de estilo · luz y orden',
  'IMG-13':'Foto para post de Instagram',
  'IMG-14':'Fondo de story',
  'IMG-15':'Catálogo · ilustración servicio 1',
  'IMG-16':'Catálogo · ilustración servicio 2',
  'IMG-17':'Catálogo · ilustración servicio 3',
  'IMG-18':'Portada de Google Business',
  'IMG-19':'Foto tomada con el celular (paso a paso)',
  'IMG-20':'Fondo del cierre · ilustración'
};
const img = (id, cls='', style='') => {
  const src = IM[id] || (id && !/^IMG-/.test(id) ? id : '');
  const pos = (M.imagenes_pos||{})[id];
  return src ? `<div class="ph ${cls}" style="background-image:url('${esc(src)}');${pos?`background-position:${pos};`:''}${style}"></div>`
             : `<div class="ph empty ${cls}" style="${style}"><b>${esc(id)}</b><span>${esc(SLOTS[id]||'')}</span></div>`;
};

/* Color: RGB y contraste WCAG */
const rgb = h => { h=h.replace('#',''); if(h.length===3) h=[...h].map(c=>c+c).join(''); return [0,2,4].map(i=>parseInt(h.substr(i,2),16)); };
const lum = h => { const [r,g,b]=rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}); return .2126*r+.7152*g+.0722*b; };
const ratio = (a,b) => { const [x,y]=[lum(a),lum(b)].sort((p,q)=>q-p); return (x+.05)/(y+.05); };
const onColor = h => ratio('#FFFFFF',h) >= ratio('#1A1626',h) ? '#FFFFFF' : '#1A1626';

/* Capítulos (estándar HORIZON, manual versión PyME) */
const CAPS = [
  {n:0,t:'Cómo usar',secs:['Para qué sirve'],d:'Para qué sirve y quién la usa'},
  {n:1,t:'Esencia',secs:['Frase','Cliente','Palabras'],d:'Frase, cliente principal y palabras clave',img:'IMG-02'},
  {n:2,t:'Logo',secs:['Versiones','Margen','Tamaño mínimo','Fondos','Usos incorrectos'],d:'Versiones, margen, tamaños, fondos y errores',img:'IMG-03'},
  {n:3,t:'Color',secs:['Paleta','Degradado','Proporciones','Contraste'],d:'Códigos, usos, proporciones y contraste',img:'IMG-04'},
  {n:4,t:'Tipografía',secs:['Familias','Jerarquía'],d:'Fuentes gratuitas y jerarquía por rol',img:'IMG-05'},
  {n:5,t:'Voz',secs:['Cómo hablamos','No decimos','WhatsApp'],d:'Cómo hablamos y respuestas tipo',img:'IMG-06'},
  {n:6,t:'Fotografía',secs:['Tres reglas','Con el celular'],d:'Estilo y cómo sacarlas',img:'IMG-07'},
  {n:7,t:'Aplicaciones',secs:['Post','Story','Perfil','Catálogo','Tarjeta','Firma','Medidas'],d:'Fichas técnicas del día a día',img:'IMG-08'},
  {n:8,t:'Archivos y custodia',secs:['Carpetas','Respaldo'],d:'Dónde están y cómo respaldarlos',img:'IMG-09'}
];
const SECNAMES = {
  0:['Para qué sirve este manual'],
  1:['Nuestra frase','Nuestro cliente principal','Palabras clave'],
  2:['Versiones del logo','Margen de respeto','Tamaño mínimo','Fondos permitidos','Usos incorrectos'],
  3:['Paleta','Degradado','Proporciones','Contraste para texto'],
  4:['Familias','Jerarquía'],
  5:['Cómo hablamos','No decimos, sí decimos','Respuestas de WhatsApp'],
  6:['Tres reglas','Cómo sacarlas con el celular'],
  7:['Post de Instagram','Story','Foto de perfil y destacadas','Catálogo de WhatsApp y Google','Tarjeta con QR','Firma de correo y letrero','Resumen de medidas'],
  8:['Carpetas y formatos','Respaldo y custodia']
};

const pages = [];
let pageNo = 0;
const add = (cls, html) => pages.push({cls, html});
const head = (c, s) => {
  const cap = CAPS[c];
  return `<div class="hd"><span class="cap">${c}.0 · ${esc(cap.t)}</span><span class="doc">${esc(DOC)} · ${esc(M.nombre)}</span>
  <span class="mi">${cap.secs.map((x,i)=>`<span class="${i===s?'on':''}">${esc(x)}</span>`).join('')}</span></div>`;
};
const foot = () => `<div class="ft"><span>${esc(DOC)} · ${esc(VER)}</span><span><b>${esc(M.nombre)}</b> &nbsp;·&nbsp; {{P}}</span></div>`;
const num = (c, s) => `<div class="num"><b>${c}.${s+1}</b><span>${esc(SECNAMES[c][s])}</span></div>`;
const content = (c, s, txt, vis, visCls='') => add('', `${head(c,s)}<div class="body"><div class="txt">${num(c,s)}${txt}</div><div class="vis ${visCls}">${vis}</div></div>${foot()}`);
const sc = (w, h, s, inner, extra='') => `<div class="sc" style="width:${w*s}px;height:${h*s}px;${extra}"><div class="in" style="width:${w}px;height:${h}px;transform:scale(${s})">${inner}</div></div>`;
const L = M.logo, LP = L.principal, LS = L.simbolo;
const logoImg = (v, st='') => `<img src="${esc(v.src)}" alt="${esc(v.nombre)}" style="${st}">`;

/* PORTADA */
add('dark cover', `${img('IMG-01','bg')}${logoImg(LP,'position:absolute;top:150px;left:50%;transform:translateX(-50%);width:560px')}
  <div class="t"><div class="lbl">${esc(M.nombre)} · Identidad</div><h1>${esc(DOC)}</h1></div>
  <div class="meta">${esc(VER)}<i>/</i>${esc((M.version||'').split('·')[1]||'')}<br>${esc(M.hecho_por||'')}</div>`);

/* ÍNDICE */
const colsIdx = [[0,1,2],[3,4],[5,6],[7,8]];
add('idx', `<div class="hd"><span class="cap">Índice</span><span class="doc">${esc(DOC)} · ${esc(M.nombre)}</span><span></span></div>
  <h1>Índice</h1><div class="cols">${colsIdx.map(col=>`<div class="col">${col.map(i=>`<div class="it"><b>${i}.0</b><h3>${esc(CAPS[i].t)}</h3><p>${esc(CAPS[i].d)}</p></div>`).join('')}</div>`).join('')}</div>${foot()}`);

const sep = c => {
  const cap = CAPS[c];
  add('dark sep', `<div class="name"><div class="lbl">Capítulo ${c}</div><h1>${esc(cap.t)}</h1></div>
  <div class="secs">${SECNAMES[c].map((s,i)=>`<div><b>${c}.${i+1}</b>${esc(s)}</div>`).join('')}</div>
  ${img(cap.img)}<div class="big g">${c}.0</div>
  <div class="dots">${CAPS.slice(1).map(k=>`<i class="${k.n===c?'on':''}"></i>`).join('')}</div>`);
};

/* 0 · CÓMO USAR */
content(0,0, `<h2>Antes de diseñar, abre esta guía.</h2><p>${esc(M.uso.para_que)}</p>`,
  `<div class="grid" style="grid-template-columns:1fr 1fr;grid-template-rows:auto auto">
    <div class="card"><div class="lbl acc" style="margin-bottom:14px">Quién la usa</div><p style="font-size:22px;line-height:1.5">${esc(M.uso.quien)}</p></div>
    <div class="card"><div class="lbl acc" style="margin-bottom:14px">Dónde están los archivos</div><p style="font-size:22px;line-height:1.5">${esc(M.uso.archivos)}</p></div>
    <div class="card" style="grid-column:1/3"><div class="lbl acc" style="margin-bottom:20px">Cómo leer las páginas</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:28px">
        <div class="cap-row" style="margin:0">${OK}<div><h4>Así sí</h4><p>El uso correcto. Cópialo tal cual.</p></div></div>
        <div class="cap-row" style="margin:0">${NO}<div><h4>Así no</h4><p>Un error común y por qué evitarlo.</p></div></div>
        <div class="cap-row" style="margin:0"><span class="mk" style="background:var(--bg2);color:var(--acc);font:500 13px var(--mono)">1.1</span><div><h4>Número de sección</h4><p>Capítulo y sección, como en el índice.</p></div></div>
      </div></div>
  </div>`);

/* 1 · ESENCIA */
sep(1);
const E = M.esencia;
const frase = esc(E.frase).replace(esc(E.frase_destacar||'\u0000'), m=>`<span class="g">${m}</span>`);
add('imp', `${head(1,0)}<div class="q">${frase}</div>
  <div class="sub"><div class="num" style="margin:0"><b style="font-size:40px">1.1</b><span>La frase completa</span></div><p>${esc(E.posicionamiento)}</p></div>${foot()}`);
const C = E.cliente;
content(1,1, `<h2>Le hablamos a una persona, no a todo el mundo.</h2><p>Todo lo que diseñamos y escribimos se piensa para este cliente. Si una pieza no le habla a esta persona, se rehace.</p>`,
  `<div class="card" style="display:grid;grid-template-columns:420px 1fr;gap:40px;padding:28px;width:100%;height:640px">
     ${img('IMG-10','', 'height:100%')}
     <div style="display:flex;flex-direction:column;gap:26px;padding:20px 12px 12px 0">
       ${[['Quién es',C.quien],['Qué le duele',C.dolor],['Qué quiere lograr',C.quiere]].map(([k,v])=>`<div><div class="lbl acc" style="margin-bottom:8px">${k}</div><p style="font-size:23px;line-height:1.45;font-weight:600">${esc(v)}</p></div>`).join('')}
       <p style="margin-top:auto;font-size:34px;line-height:1.2;font-weight:800;letter-spacing:-.03em">${esc(C.frase)}</p>
     </div></div>`);
content(1,2, `<h2>Cinco palabras para decidir.</h2><p>Si dudas entre dos opciones (un color, una foto, una frase), elige la que se parezca más a estas palabras.</p>`,
  `<div style="width:100%;border-top:1px solid var(--line2)">${E.palabras.map((w,i)=>`<div style="display:grid;grid-template-columns:90px 420px 1fr;align-items:center;gap:24px;padding:26px 0;border-bottom:1px solid var(--line2)">
     <span class="lbl acc" style="font-size:16px">0${i+1}</span><span style="font-size:64px;font-weight:800;letter-spacing:-.04em;line-height:1">${esc(w.p)}</span><span style="font-size:20px;line-height:1.45;color:var(--ink2)">${esc(w.d)}</span></div>`).join('')}</div>`);

/* 2 · LOGO */
sep(2);
const bgTile = logoDark ? 'deep' : 'cream';
content(2,0, `<h2>Tres formas, una misma marca.</h2><p><strong>${esc(LP.nombre)}:</strong> ${esc(LP.uso)}</p><p><strong>${esc(LS.nombre)}:</strong> ${esc(LS.uso)}</p>${logoDark?`<p>${esc(L.regla)}</p>`:''}`,
  `<div class="grid" style="grid-template-columns:repeat(3,1fr);grid-template-rows:440px 260px">
    <div style="grid-column:1/4;display:flex;flex-direction:column;gap:12px"><div class="tile ${bgTile}" style="flex:1">${logoImg(LP,'width:62%;max-width:none;max-height:none')}</div><span class="lbl">${esc(LP.nombre)}</span></div>
    <div style="display:flex;flex-direction:column;gap:12px"><div class="tile ink" style="flex:1">${logoImg(LS,'height:150px;max-height:none')}</div><span class="lbl">${esc(LS.nombre)}</span></div>
    <div style="display:flex;flex-direction:column;gap:12px"><div class="tile cream" style="flex:1"><div style="width:180px;height:180px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center">${logoImg(LS,'width:62%')}</div></div><span class="lbl">Foto de perfil (círculo)</span></div>
    <div style="display:flex;flex-direction:column;gap:12px"><div class="tile cream" style="flex:1"><div style="background:#fff;border:1px solid var(--line2);border-radius:12px 12px 0 0;padding:12px 18px;display:flex;align-items:center;gap:12px;width:300px;box-shadow:0 6px 20px rgba(26,22,38,.08)"><span style="width:32px;height:32px;border-radius:7px;background:var(--ink);display:flex;align-items:center;justify-content:center">${logoImg(LS,'width:24px')}</span><span style="font-size:15px;font-weight:600">${esc(M.nombre)}</span><span style="margin-left:auto;color:var(--ink3)">${ico('i-x')}</span></div></div><span class="lbl">Pestaña del navegador · 32 px</span></div>
  </div>`);
const LW = 760, LH = Math.round(LW*272/1400), X = Math.round(LH*.82);
content(2,1, `<h2>Déjalo respirar.</h2><p>${esc(L.margen)}</p><p>Mientras más aire tenga alrededor, más se nota.</p>`,
  `<div class="tile ${bgTile}" style="width:100%;height:760px">
     <div style="position:relative;width:${LW}px;height:${LH}px">
       <div style="position:absolute;inset:-${X}px;border:2px dashed rgba(255,255,255,.55);border-radius:6px"></div>
       <div style="position:absolute;left:-${X}px;top:${LH/2-1}px;width:${X}px;border-top:2px solid var(--acc)"></div>
       <div style="position:absolute;left:-${X/2+14}px;top:${LH/2-40}px;font:500 26px var(--mono);color:var(--acc)">x</div>
       <div style="position:absolute;top:-${X}px;left:${LW/2-1}px;height:${X}px;border-left:2px solid var(--acc)"></div>
       <div style="position:absolute;top:-${X/2+16}px;left:${LW/2+12}px;font:500 26px var(--mono);color:var(--acc)">x</div>
       ${logoImg(LP,`width:${LW}px;display:block`)}
     </div></div>`);
content(2,2, `<h2>Que se lea en cualquier tamaño.</h2><p>Bajo estos tamaños el logo pierde detalle. En pantalla manda la medida en píxeles; en impresión, la de centímetros.</p>
  <dl class="specs">${L.minimos.map(m=>`<div><dt>${esc(m.version)}</dt><dd>${m.px} px · ${esc(m.cm)}</dd></div>`).join('')}</dl>`,
  `<div class="grid" style="grid-template-columns:1.5fr 1fr;grid-template-rows:330px 330px">
     ${[[LP,L.minimos[0].px*2,'Recomendado'],[LS,L.minimos[1].px*3,'Recomendado'],[LP,L.minimos[0].px,'Mínimo'],[LS,L.minimos[1].px,'Mínimo']].map(([v,w,t],i)=>`<div style="display:flex;flex-direction:column;gap:12px"><div class="tile ink" style="flex:1">${logoImg(v,(v===LP?`width:${w}px`:`width:${w}px`)+';max-width:none;max-height:none')}</div><span class="lbl">${t} · ${w} px</span></div>`).join('')}
   </div>`);
content(2,3, `<h2>Sobre qué va.</h2><p>${logoDark?esc(L.regla):'El logo va sobre los fondos de la marca o sobre fotos con suficiente contraste.'}</p><p>Sobre una foto, oscurécela o elige una zona tranquila de la imagen.</p>`,
  `<div class="grid" style="grid-template-columns:repeat(3,1fr)">${L.fondos.map(f=>{const src=f.img&&(IM[f.img]||'');const bg=f.img?(src?`linear-gradient(${f.overlay},${f.overlay}),url('${esc(src)}') center/cover`:`linear-gradient(${f.overlay},${f.overlay}),var(--ink3)`):f.css;return `<div><div class="tile" style="height:520px;background:${bg}">${f.img&&!src?`<b style="position:absolute;left:20px;bottom:18px;font:500 16px var(--mono);color:var(--acc)">${esc(f.img)}</b>`:''}${logoImg(LP,'width:78%;max-width:none')}</div><div class="cap-row">${f.ok?OK:NO}<div><h4>${esc(f.nombre)}</h4></div></div></div>`}).join('')}</div>`);
const MAL = {
  'bg-claro': ['background:var(--bg2);border:1px solid var(--line2)', ''],
  'recolor': ['background:var(--ink)', 'filter:brightness(0) invert(1) sepia(1) saturate(7) hue-rotate(-18deg)'],
  'estirar': ['background:var(--ink)', 'transform:scale(1.35,.7)'],
  'sombra': ['background:var(--ink)', 'filter:drop-shadow(10px 12px 0 #F2690C) drop-shadow(0 0 22px #fff)'],
  'rotar': ['background:var(--ink)', 'transform:rotate(-14deg)'],
  'recargado': ['background:repeating-linear-gradient(60deg,#FFE2CC 0 26px,#F2690C 26px 40px,#ECE3FF 40px 66px,#C4467A 66px 80px)', '']
};
content(2,4, `<h2>Lo que nunca se hace.</h2><p>El logo se usa como se entrega. Si una pieza no deja que se vea bien, se cambia la pieza, no el logo.</p>`,
  `<div class="grid" style="grid-template-columns:repeat(3,1fr);row-gap:28px">${L.incorrectos.map(x=>{const [bg,st]=MAL[x.estilo]||['background:var(--ink)',''];return `<div><div class="tile" style="height:250px;${bg}">${logoImg(LP,'width:70%;max-width:none;'+st)}</div><div class="cap-row">${NO}<div><h4>${esc(x.nombre)}</h4><p>${esc(x.porque)}</p></div></div></div>`}).join('')}</div>`);

/* 3 · COLOR */
sep(3);
const COLS = M.colores, SUN = COLS.filter(c=>c.grupo==='atardecer'), NEU = COLS.filter(c=>c.grupo!=='atardecer');
const byRol = (r, i) => (COLS.find(c=>c.rol===r) || COLS[i] || {}).hex;
const swatchCard = c => { const t=onColor(c.hex); return `<div style="border-radius:20px;overflow:hidden;border:1px solid var(--line2);background:#fff">
     <div style="height:150px;background:${c.hex};color:${t};padding:20px 24px;display:flex;flex-direction:column;justify-content:space-between"><span style="font-size:26px;font-weight:800;letter-spacing:-.02em">${esc(c.nombre)}</span><span style="font:500 18px var(--mono)">${c.hex.toUpperCase()}</span></div>
     <div style="padding:14px 24px 18px"><div class="lbl" style="margin-bottom:6px">RGB ${rgb(c.hex).join(' · ')}</div><p style="font-size:15px;line-height:1.45;color:var(--ink2)">${esc(c.uso)}</p></div></div>`; };
content(3,0, `<h2>${SUN.length?'Un atardecer, en colores.':'Pocos colores, cada uno con su tarea.'}</h2><p>${esc(M.paleta_idea||'Usa siempre estos códigos exactos.')}</p><p>Usa siempre estos códigos exactos: un naranja "parecido" ya es otra marca. HEX para pantalla y Canva; RGB para presentaciones y video.</p>`,
  SUN.length ? `<div style="width:100%;display:flex;flex-direction:column;gap:24px">
     <div><div class="lbl acc" style="margin-bottom:12px">Atardecer</div><div style="display:flex;height:430px;border-radius:24px;overflow:hidden">${SUN.map(c=>{const t=onColor(c.hex);return `<div style="flex:1;background:${c.hex};color:${t};padding:22px 18px;display:flex;flex-direction:column">
       <span style="font-size:24px;font-weight:800;letter-spacing:-.02em">${esc(c.nombre)}</span><span style="font:500 16px/1.6 var(--mono);margin-top:6px">${c.hex.toUpperCase()}<br><span style="opacity:.75">${rgb(c.hex).join(' ')}</span></span>
       <span style="margin-top:auto;font-size:14px;line-height:1.4;opacity:.9">${esc(c.uso)}</span></div>`}).join('')}</div></div>
     <div><div class="lbl" style="margin-bottom:12px">Neutros</div><div class="grid" style="grid-template-columns:repeat(${NEU.length},1fr)">${NEU.map(swatchCard).join('')}</div></div></div>`
  : `<div class="grid" style="grid-template-columns:repeat(${COLS.length>6?4:3},1fr)">${COLS.map(swatchCard).join('')}</div>`);
const D = M.degradado;
content(3,1, `<h2>${esc(D.nombre)}.</h2><p>${esc(D.uso)}</p>`,
  `<div style="width:100%;display:flex;flex-direction:column;gap:28px">
     <div style="height:${M.degradado_simbolo?210:300}px;border-radius:24px;background:${D.css};display:flex;align-items:flex-end;justify-content:space-between;padding:26px 30px;font:500 18px var(--mono);color:#fff">${(D.css.match(/#[0-9A-Fa-f]{6}/g)||[]).map(h=>`<span>${h.toUpperCase()}</span>`).join('')}</div>
     ${M.degradado_simbolo?`<div style="display:grid;grid-template-columns:1fr 330px;gap:24px;align-items:center"><div style="height:64px;border-radius:14px;background:${M.degradado_simbolo.css};display:flex;align-items:center;justify-content:space-between;padding:0 20px;font:500 13px var(--mono);color:#fff">${(M.degradado_simbolo.css.match(/#[0-9A-Fa-f]{6}/g)||[]).map((h,i)=>`<span style="color:${i?'#fff':'#1A1626'}">${h.toUpperCase()}</span>`).join('')}</div><p style="font-size:16px;line-height:1.45;color:var(--ink2)"><b style="color:var(--ink)">${esc(M.degradado_simbolo.nombre)}.</b> ${esc(M.degradado_simbolo.uso)}</p></div>`:''}
     <div class="grid" style="grid-template-columns:1fr 1fr">
       <div><div class="tile cream" style="height:250px;justify-content:flex-start;padding:40px"><p style="font-size:52px;font-weight:800;letter-spacing:-.04em;line-height:1.02">Tu negocio en <span style="background:${D.css};-webkit-background-clip:text;background-clip:text;color:transparent">un solo link.</span></p></div><div class="cap-row">${OK}<div><h4>En una palabra o frase corta</h4><p>Marca lo importante y deja el resto en tinta.</p></div></div></div>
       <div><div class="tile cream" style="height:250px;justify-content:flex-start;padding:40px"><p style="font-size:21px;line-height:1.5;background:${D.css};-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:600">Agendas en un minuto, te llega tu portal y pagas desde ahí. Tu entrega se libera sola cuando pagas el saldo, sin perseguir a nadie y sin transferencias.</p></div><div class="cap-row">${NO}<div><h4>En párrafos</h4><p>Cansa la vista y pierde contraste.</p></div></div></div>
     </div></div>`);
const tot = M.colores.reduce((a,c)=>a+(c.prop||0),0)||1;
const PROP = [...M.colores].sort((x,y)=>(y.prop||0)-(x.prop||0));
content(3,2, `<h2>Cuánto de cada uno.</h2><p>La mayor parte es fondo claro. La tinta ordena y el acento aparece poco: por eso se nota.</p>
  <dl class="specs">${PROP.map(c=>`<div><dt>${esc(c.nombre)}</dt><dd>${Math.round(c.prop/tot*100)} %</dd></div>`).join('')}</dl>`,
  `<div style="width:100%;display:flex;flex-direction:column;gap:36px">
     <div style="display:flex;height:150px;border-radius:20px;overflow:hidden;border:1px solid var(--line2)">${PROP.map(c=>`<div style="flex:${c.prop};background:${c.hex};color:${onColor(c.hex)};padding:16px 10px;font:500 15px var(--mono)">${c.prop/tot>=.04?Math.round(c.prop/tot*100)+'%':''}</div>`).join('')}</div>
     <div style="height:520px;border-radius:20px;overflow:hidden;border:1px solid var(--line2);background:${byRol('fondo',1)};display:flex;flex-direction:column">
       <div style="height:72px;background:${byRol('tinta',0)};display:flex;align-items:center;padding:0 36px;gap:14px">${logoImg(LP,'height:26px')}<span style="margin-left:auto;display:flex;gap:28px;color:rgba(255,255,255,.7);font-size:15px"><span>Planes</span><span>Casos</span><span>Agendar</span></span></div>
       <div style="flex:1;display:grid;grid-template-columns:1.2fr 1fr;gap:40px;padding:56px 56px">
         <div><div class="lbl" style="color:${byRol('acento',3)};margin-bottom:18px">Diagnóstico gratis</div><p style="font-size:54px;font-weight:800;letter-spacing:-.04em;line-height:1.02;color:${byRol('tinta',0)}">${frase}</p>
         <span style="display:inline-block;margin-top:30px;background:${byRol('acento',3)};color:#fff;font-weight:700;font-size:17px;padding:16px 26px;border-radius:999px">Agenda tu diagnóstico</span></div>
         <div style="background:${byRol('fondo2',2)};border-radius:18px"></div></div></div></div>`);
content(3,3, `<h2>Que el texto se lea.</h2><p>Revisamos cada combinación con la norma WCAG. <strong>AA</strong> pide 4,5 : 1 para texto normal y 3 : 1 para texto grande (24 px o más, o 19 px en negrita).</p><p>Si una combinación solo sirve en grande, se usa solo en títulos y botones.</p>`,
  `<div style="width:100%;border-top:1px solid var(--line2)">${M.contrastes.map(([f,b])=>{const r=ratio(f,b);const n=r>=4.5,g=r>=3;return `<div style="display:grid;grid-template-columns:330px 230px 1fr 1fr;align-items:center;gap:24px;padding:10px 0;border-bottom:1px solid var(--line2)">
     <div style="background:${b};color:${f};border-radius:14px;padding:14px 26px;border:1px solid var(--line2)"><span style="font-size:30px;font-weight:800">Aa</span> <span style="font-size:18px;margin-left:8px">Texto de ejemplo</span></div>
     <div style="font:500 16px/1.6 var(--mono);color:var(--ink2)">${f.toUpperCase()}<br>sobre ${b.toUpperCase()}</div>
     <div><span style="font:500 34px var(--mono);letter-spacing:-.02em">${r.toFixed(1).replace('.',',')}</span><span style="font:500 16px var(--mono);color:var(--ink3)"> : 1</span></div>
     <div style="display:flex;gap:10px">${[['Texto',n],['Grande',g]].map(([k,v])=>`<span style="font:500 13px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:9px 14px;border-radius:999px;${v?'background:var(--acc);color:#fff':'background:var(--bg2);color:var(--ink3);text-decoration:line-through'}">${k} AA</span>`).join('')}</div></div>`}).join('')}</div>`);

/* 4 · TIPOGRAFÍA */
sep(4);
content(4,0, `<h2>Dos fuentes, gratuitas.</h2><p>Una para leer y titular; otra para etiquetas y cifras. No se suman más.</p><p style="font-size:17px">${esc(M.canva||'')}</p>`,
  `<div class="grid" style="grid-template-columns:1fr 1fr">${M.tipografias.map(t=>`<div class="card" style="height:720px;display:flex;flex-direction:column;padding:40px">
     <div class="lbl acc">${esc(t.rol)}</div>
     <div style="font-family:${t.css};font-weight:${t.peso_muestra};font-size:250px;line-height:1;letter-spacing:-.04em;margin:30px 0 10px">Aa</div>
     <div style="font-family:${t.css};font-weight:${t.peso_muestra};font-size:40px;letter-spacing:-.02em;margin-bottom:8px">${esc(t.familia)}</div>
     <div class="lbl" style="margin-bottom:auto">${esc(t.pesos)}</div>
     <div style="font-family:${t.css};font-size:22px;line-height:1.6;color:var(--ink2);word-break:break-all">ABCDEFGHIJKLMNÑOPQRSTUVWXYZ<br>abcdefghijklmnñopqrstuvwxyz<br>0123456789 áéíóú ¿? ¡! $ %</div></div>`).join('')}</div>`);
content(4,1, `<h2>Cada texto con su rol.</h2><p>Antes de escribir, pregúntate qué es: un título, una etiqueta, un texto o un botón. Cada rol tiene una sola forma.</p>`,
  `<div style="width:100%;border-top:1px solid var(--line2)">${M.jerarquia.map(j=>`<div style="display:grid;grid-template-columns:150px 1fr 330px;align-items:center;gap:32px;padding:30px 0;border-bottom:1px solid var(--line2)">
     <span class="lbl acc">${esc(j.rol)}</span>
     <div>${j.boton?`<span style="${j.css};display:inline-block;background:var(--grad);color:#fff;padding:18px 30px;border-radius:999px">${esc(j.ej)}</span>`:`<div style="${j.css}">${esc(j.ej)}</div>`}</div>
     <span style="font:400 14px/1.6 var(--mono);color:var(--ink3)">${esc(j.spec||'')}</span></div>`).join('')}</div>`);

/* 5 · VOZ */
sep(5);
const V = M.voz;
content(5,0, `<h2>Así suena ${esc(M.nombre)}.</h2><p>${esc(V.resumen)}</p><p>El punto marca dónde estamos entre cada par de opuestos.</p>`,
  `<div style="width:100%;display:flex;flex-direction:column;gap:56px;padding:0 40px">${V.escalas.map(e=>`<div><div style="display:flex;justify-content:space-between;font-size:26px;font-weight:700;margin-bottom:20px"><span>${esc(e.izq)}</span><span style="color:var(--ink3)">${esc(e.der)}</span></div>
     <div style="position:relative;height:6px;border-radius:6px;background:var(--line2)"><div style="position:absolute;left:0;top:0;bottom:0;width:${e.pos}%;background:var(--grad);border-radius:6px"></div><span style="position:absolute;left:${e.pos}%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 7px var(--bg),0 0 0 8px var(--line2)"></span></div></div>`).join('')}</div>`);
content(5,1, `<h2>No decimos, sí decimos.</h2><p>Frases reales reescritas en nuestra voz. Cuando dudes, busca la frase más concreta y en segunda persona.</p>`,
  `<div style="width:100%"><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:12px"><span class="lbl">No decimos</span><span class="lbl acc">Sí decimos</span></div>
   ${V.tabla.map(([a,b])=>`<div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;border-top:1px solid var(--line2);padding:20px 0;align-items:center">
     <div style="display:flex;gap:16px;align-items:center;color:var(--ink3);font-size:21px">${NO}<span style="text-decoration:line-through;text-decoration-thickness:1.5px">${esc(a)}</span></div>
     <div style="display:flex;gap:16px;align-items:center;font-size:23px;font-weight:700">${OK}<span>${esc(b)}</span></div></div>`).join('')}</div>`);
content(5,2, `<h2>El mensaje también es marca.</h2><p>Las primeras respuestas por WhatsApp se dejan guardadas, con el mismo tono de la web.</p>
   ${(V.whatsapp||[]).map((w,i)=>`<p><strong>${i+1} · ${esc(w.etiqueta)}</strong></p>`).join('')}`,
  `<div style="width:430px;height:820px;border-radius:56px;background:var(--ink);padding:14px;box-shadow:0 30px 60px rgba(26,22,38,.18)">
     <div style="width:100%;height:100%;border-radius:44px;overflow:hidden;background:#EFE7DD;display:flex;flex-direction:column">
       <div style="background:#1F2C34;color:#fff;padding:52px 22px 16px;display:flex;align-items:center;gap:14px"><span style="width:44px;height:44px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center">${logoImg(LS,'width:30px')}</span><div><div style="font-weight:700;font-size:17px">${esc(M.nombre)}</div><div style="font-size:12px;opacity:.7">Cuenta de empresa</div></div></div>
       <div style="flex:1;padding:22px 16px;display:flex;flex-direction:column;gap:16px">${(V.whatsapp||[]).map((w,i)=>`<div style="align-self:${i%2?'flex-end':'flex-start'};max-width:86%;background:${i%2?'#D9FDD3':'#fff'};border-radius:14px;padding:12px 14px 8px;font-size:15px;line-height:1.42;box-shadow:0 1px 1px rgba(0,0,0,.08)"><div style="font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:5px">${i+1} · ${esc(w.etiqueta)}</div>${esc(w.texto)}</div>`).join('')}</div></div></div>`);

/* 6 · FOTOGRAFÍA */
sep(6);
content(6,0, `<h2>Fotos reales, ordenadas y con luz.</h2><p>Las imágenes de esta página marcan el estilo. En publicaciones se usan fotos reales del negocio y de sus clientes, con permiso.</p>`,
  `<div class="grid" style="grid-template-columns:repeat(3,1fr)">${M.fotografia.map((f,i)=>`<div style="display:flex;flex-direction:column;gap:18px">${img(f.img,'','height:560px')}<div><div class="lbl acc" style="margin-bottom:8px">Regla ${i+1}</div><h4 style="font-size:24px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px">${esc(f.titulo)}</h4><p style="font-size:16px;line-height:1.45;color:var(--ink2)">${esc(f.texto)}</p></div></div>`).join('')}</div>`);
content(6,1, `<h2>Con el celular basta.</h2><p>No necesitas cámara. Necesitas estos cinco hábitos.</p>`,
  `<div style="display:grid;grid-template-columns:1fr 400px;gap:56px;width:100%;align-items:center">
     <ol style="list-style:none;border-top:1px solid var(--line2)">${(M.fotografia_celular||[]).map((p,i)=>`<li style="display:grid;grid-template-columns:70px 1fr;gap:16px;padding:26px 0;border-bottom:1px solid var(--line2);font-size:25px;font-weight:600;line-height:1.35"><span class="lbl acc" style="font-size:18px">0${i+1}</span>${esc(p)}</li>`).join('')}</ol>
     <div style="width:400px;height:780px;border-radius:54px;background:var(--ink);padding:14px"><div style="width:100%;height:100%;border-radius:42px;overflow:hidden;position:relative">${img('IMG-19','','position:absolute;inset:0;border-radius:0')}
       ${IM['IMG-19']?'':`<div style="position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.5)) 33.33% 0/1.5px 100% no-repeat,linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.5)) 66.66% 0/1.5px 100% no-repeat,linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.5)) 0 33.33%/100% 1.5px no-repeat,linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.5)) 0 66.66%/100% 1.5px no-repeat"></div>
       <span style="position:absolute;left:50%;bottom:30px;width:70px;height:70px;margin-left:-35px;border-radius:50%;border:5px solid #fff"></span>`}</div></div></div>`);

/* 7 · APLICACIONES */
sep(7);
const A = M.aplicaciones;
const spec = rows => `<dl class="specs">${rows.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`;
const sello = (h=60) => `<span style="display:inline-flex;align-items:center;background:var(--ink);border-radius:999px;padding:${h*.3}px ${h*.5}px">${logoImg(LP,`height:${h*.42}px`)}</span>`;
const post1 = `<div style="width:1080px;height:1350px;background:var(--bg);padding:96px;display:flex;flex-direction:column">
   <div style="font:500 30px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--acc)">${esc(A.post.etiqueta)}</div>
   <div style="margin-top:auto;font-weight:800;font-size:132px;line-height:.98;letter-spacing:-.045em">${esc(A.post.titulo)}<br><span class="g">${esc(A.post.titulo2)}</span></div>
   <div style="margin-top:80px;display:flex;justify-content:space-between;align-items:center"><span style="font-size:32px;color:var(--ink2)">Desliza →</span>${sello(110)}</div></div>`;
const post2 = `<div style="width:1080px;height:1350px;position:relative;background:var(--ink)">${img('IMG-13','','position:absolute;inset:0;border-radius:0')}
   <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(26,22,38,0) 40%,rgba(26,22,38,.85) 100%)"></div>
   <div style="position:absolute;left:96px;right:96px;bottom:96px;color:#fff"><div style="font-weight:800;font-size:96px;line-height:1;letter-spacing:-.04em;margin-bottom:56px">Así se ve un negocio que responde a tiempo.</div>${sello(110)}</div></div>`;
content(7,0, `<h2>Post de Instagram.</h2><p>Dos tipos: frase sobre crema y foto con texto abajo. El sello del logo siempre sobre tinta.</p>`+
  spec([['Medida','1080 × 1350 px (4:5)'],['Formato','JPG o PNG'],['Margen','96 px a cada lado'],['Grilla','Lo clave dentro del cuadrado central']]),
  `<div style="display:flex;gap:24px">${sc(1080,1350,.51,post1,'border-radius:14px;overflow:hidden;box-shadow:0 20px 50px rgba(26,22,38,.12)')}${sc(1080,1350,.51,post2,'border-radius:14px;overflow:hidden;box-shadow:0 20px 50px rgba(26,22,38,.12)')}</div>`);
const story = `<div style="width:1080px;height:1920px;position:relative;background:var(--deep);color:#fff">${img('IMG-14','','position:absolute;inset:0;border-radius:0;opacity:.55')}
   <div style="position:absolute;left:0;right:0;top:0;height:250px;background:repeating-linear-gradient(135deg,rgba(242,105,12,.35) 0 14px,rgba(242,105,12,.12) 14px 28px);border-bottom:3px dashed #F2690C"></div>
   <div style="position:absolute;left:0;right:0;bottom:0;height:250px;background:repeating-linear-gradient(135deg,rgba(242,105,12,.35) 0 14px,rgba(242,105,12,.12) 14px 28px);border-top:3px dashed #F2690C"></div>
   <div style="position:absolute;left:96px;top:110px;font:500 34px var(--mono);color:#fff">250 px libres</div><div style="position:absolute;left:96px;bottom:110px;font:500 34px var(--mono);color:#fff">250 px libres</div>
   <div style="position:absolute;left:96px;right:96px;top:420px">${logoImg(LP,'height:80px')}<div style="margin-top:420px;font-weight:800;font-size:128px;line-height:.98;letter-spacing:-.045em">${esc(A.story.titulo)}</div>
   <div style="margin-top:70px;display:inline-block;background:#fff;color:var(--ink);font-weight:800;font-size:44px;padding:30px 48px;border-radius:999px">${esc(A.story.cta)}</div></div></div>`;
content(7,1, `<h2>Story.</h2><p>Instagram tapa la parte de arriba (tu nombre) y la de abajo (responder). Nada importante va en esas franjas.</p>`+
  spec([['Medida','1080 × 1920 px (9:16)'],['Formato','JPG, PNG o MP4'],['Zona segura','250 px libres arriba y abajo'],['Texto','Máx. 2 líneas de título']]),
  sc(1080,1920,.43,story,'border-radius:18px;overflow:hidden;box-shadow:0 20px 50px rgba(26,22,38,.14)'));
content(7,2, `<h2>Foto de perfil y destacadas.</h2><p>El perfil usa el símbolo, centrado para el recorte circular. Las destacadas comparten fondo e ícono de trazo, sin emojis.</p>`+
  spec([['Perfil','1080 × 1080 px, PNG'],['Destacadas','1080 × 1920 px, ícono al centro'],['Íconos','Trazo 1,75, mismo set']]),
  `<div style="display:flex;flex-direction:column;align-items:center;gap:60px">
     <div style="display:flex;align-items:center;gap:56px"><div style="width:320px;height:320px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px var(--bg),0 0 0 9px var(--acc)">${logoImg(LS,'width:62%')}</div>
     <div><div style="font-size:30px;font-weight:800;margin-bottom:6px">${esc(M.nombre.toLowerCase())}</div><div style="font-size:18px;color:var(--ink2);line-height:1.5;max-width:460px">${esc(M.esencia.frase)}</div></div></div>
     <div style="display:flex;gap:44px">${(A.destacadas||[]).map(([i,t])=>`<div style="text-align:center"><div style="width:150px;height:150px;border-radius:50%;background:var(--deep);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 5px var(--bg),0 0 0 7px var(--line2)"><svg class="ico" style="width:58px;height:58px" aria-hidden="true"><use href="#${i}"/></svg></div><div style="margin-top:18px;font-size:18px;font-weight:600">${esc(t)}</div></div>`).join('')}</div></div>`);
content(7,3, `<h2>Catálogo de WhatsApp y Google.</h2><p>Un ítem por servicio, con la misma ilustración de fondo y el precio a la vista. En Google, el símbolo como logo y una portada real.</p>`+
  spec([['Catálogo','1080 × 1080 px por servicio, JPG'],['Google · logo','720 × 720 px o más'],['Google · portada','1024 × 576 px o más']]),
  `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px;width:100%">${(A.catalogo||[]).map(c=>`<div style="background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden">${img(c.img,'','height:300px;border-radius:0;background-size:contain')}<div style="padding:20px 22px"><div style="font-size:21px;font-weight:800;letter-spacing:-.02em">${esc(c.nombre)}</div><div style="font-size:15px;color:var(--ink2);margin:4px 0 12px">${esc(c.detalle)}</div><div style="font:500 20px var(--mono);color:var(--acc)">${esc(c.precio)}</div></div></div>`).join('')}
    <div style="grid-column:1/4;display:grid;grid-template-columns:200px 1fr;gap:24px;height:250px"><div class="tile ink">${logoImg(LS,'width:58%')}</div>${img('IMG-18','','height:250px')}</div></div>`);
const T = A.tarjeta, CW = 1063, CH = 591;
const cardF = `<div style="width:${CW}px;height:${CH}px;background:var(--deep);display:flex;align-items:center;justify-content:center">${logoImg(LP,'width:56%')}</div>`;
const cardB = `<div style="width:${CW}px;height:${CH}px;background:var(--bg);padding:70px 80px;display:grid;grid-template-columns:1fr 280px;gap:40px;align-items:center">
  <div><div style="font-weight:800;font-size:52px;letter-spacing:-.03em;line-height:1.05">${esc(T.nombre)}</div><div style="font:500 22px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin:12px 0 44px">${esc(T.cargo)}</div>
  <div style="font-size:28px;line-height:1.6;color:var(--ink2)">${esc(T.web)}<br>${esc(T.whatsapp)}</div></div>
  <div style="text-align:center"><div class="qr" data-qr="${esc(T.qr)}" style="width:260px;height:260px;margin:0 auto"></div><div style="font:500 18px var(--mono);margin-top:14px;color:var(--ink2)">Agenda aquí</div></div></div>`;
const bleed = inner => `<div style="padding:18px;border:2px dashed var(--line2);border-radius:6px;position:relative">${inner}<span style="position:absolute;right:8px;bottom:-26px;font:500 12px var(--mono);color:var(--ink3);letter-spacing:.1em">SANGRADO 3 MM</span></div>`;
content(7,4, `<h2>Tarjeta con QR para agendar.</h2><p>Por delante, la marca. Por detrás, quién eres y un QR que lleva directo a agendar. Así la tarjeta trae clientes, no solo un número.</p>`+
  spec([['Medida','9 × 5 cm'],['Resolución','300 ppi · CMYK en imprenta'],['Sangrado','3 mm por lado'],['QR','Mín. 2 × 2 cm, a '+esc(T.qr.replace(/^https?:\/\/(www\.)?/,''))]]),
  `<div style="display:flex;flex-direction:column;gap:56px">${bleed(sc(CW,CH,.58,cardF,'box-shadow:0 14px 30px rgba(26,22,38,.12)'))}${bleed(sc(CW,CH,.58,cardB,'box-shadow:0 14px 30px rgba(26,22,38,.12)'))}</div>`);
content(7,5, `<h2>Firma de correo y letrero.</h2><p>La firma va como imagen liviana, con el sello sobre tinta. El letrero se pide siempre en vectorial, a la medida real del lugar.</p>`+
  spec([['Firma','600 × 200 px, PNG'],['Letrero','Medida real · PDF o SVG'],['Logo en letrero','Máx. 60 % del ancho']]),
  `<div style="display:flex;flex-direction:column;gap:40px;width:100%">
     <div class="card" style="padding:0;overflow:hidden"><div style="padding:16px 24px;border-bottom:1px solid var(--line);font-size:15px;color:var(--ink3)">Para: cliente@correo.cl &nbsp;·&nbsp; Asunto: Tu propuesta</div><div style="padding:28px 32px 32px"><p style="font-size:17px;color:var(--ink2);margin-bottom:24px">Hola, te dejo la propuesta y los próximos pasos.</p>
       <div style="width:600px;height:200px;border:1px dashed var(--line2);border-radius:10px;display:grid;grid-template-columns:200px 1fr;overflow:hidden"><div style="background:var(--ink);display:flex;align-items:center;justify-content:center">${logoImg(LS,'width:46%')}</div><div style="padding:30px 28px;display:flex;flex-direction:column;justify-content:center;gap:6px"><b style="font-size:20px">${esc(T.nombre)}</b><span style="font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--acc)">${esc(T.cargo)}</span><span style="font-size:14px;color:var(--ink2);margin-top:8px">${esc(T.web)} · ${esc(T.whatsapp)}</span></div></div></div></div>
     <div style="height:300px;border-radius:20px;background:#B9B0A4 linear-gradient(180deg,#CFC7BC,#A79E92);display:flex;align-items:center;justify-content:center;position:relative"><div style="width:62%;height:56%;background:var(--ink);border-radius:8px;display:flex;align-items:center;justify-content:center;box-shadow:0 18px 30px rgba(26,22,38,.3)">${logoImg(LP,'width:60%')}</div><span style="position:absolute;left:24px;bottom:18px;font:500 12px var(--mono);letter-spacing:.12em;color:#fff">LETRERO · MAQUETA</span></div></div>`);
const MED = [['Post de Instagram','1080 × 1350 px','JPG / PNG'],['Story','1080 × 1920 px · 250 px libres arriba y abajo','JPG / PNG'],['Foto de perfil','1080 × 1080 px · centrada','PNG'],['Portadas de destacadas','1080 × 1920 px · ícono al centro','PNG'],['Catálogo de WhatsApp','1080 × 1080 px por servicio','JPG'],['Google Business','720 × 720 px o más','JPG / PNG'],['Tarjeta con QR','9 × 5 cm · 300 ppi · 3 mm de sangrado','PDF de imprenta'],['Letrero o vinilo','Según medida real','PDF / SVG'],['Firma de correo','600 × 200 px','PNG']];
content(7,6, `<h2>Todas las medidas en una página.</h2><p>Imprime esta tabla o guárdala en el celular. Si una pieza no está aquí, pregunta antes de inventar la medida.</p>`,
  `<div style="width:100%"><div style="display:grid;grid-template-columns:1.1fr 1.6fr .8fr;gap:24px;padding-bottom:12px"><span class="lbl">Pieza</span><span class="lbl">Medida</span><span class="lbl">Formato</span></div>
   ${MED.map(r=>`<div style="display:grid;grid-template-columns:1.1fr 1.6fr .8fr;gap:24px;padding:19px 0;border-top:1px solid var(--line2);font-size:21px"><b style="font-weight:700">${r[0]}</b><span style="font-family:var(--mono);font-size:18px;color:var(--ink2)">${r[1]}</span><span style="font-family:var(--mono);font-size:18px;color:var(--acc)">${r[2]}</span></div>`).join('')}</div>`);

/* 8 · ARCHIVOS Y CUSTODIA */
sep(8);
const AR = M.archivos;
content(8,0, `<h2>Todo en una carpeta.</h2><p>Los originales viven en <strong>${esc(AR.raiz)}</strong>. Antes de diseñar, descarga de ahí: nunca de una captura ni de un chat.</p>
   ${spec([['SVG','Web, letrero e imprenta. Escala sin perder calidad'],['PNG','Redes y presentaciones. Fondo transparente'],['PDF','Imprenta y documentos'],['JPG','Fotos']])}`,
  `<div class="card" style="width:100%;padding:40px 48px;font-family:var(--mono)"><div style="font-size:26px;font-weight:500;margin-bottom:24px;display:flex;align-items:center;gap:14px;color:var(--ink)">${ico('i-layers')} ${esc(AR.raiz)}</div>
   ${AR.arbol.map(([f,d],i)=>`<div style="display:grid;grid-template-columns:420px 1fr;gap:24px;padding:18px 0 18px 40px;border-top:1px solid var(--line);position:relative"><span style="position:absolute;left:8px;top:0;bottom:${i===AR.arbol.length-1?'50%':'0'};border-left:1.5px solid var(--line2)"></span><span style="position:absolute;left:8px;top:50%;width:20px;border-top:1.5px solid var(--line2)"></span><span style="font-size:20px;color:var(--ink)">${esc(f)}</span><span style="font-family:var(--sans);font-size:18px;color:var(--ink2)">${esc(d)}</span></div>`).join('')}</div>`);
content(8,1, `<h2>Desde la entrega, los cuidas tú.</h2><p>${esc(AR.respaldo)}</p>`,
  `<div class="grid" style="grid-template-columns:repeat(3,1fr)">${(AR.pasos||[]).map(([t,d],i)=>`<div class="card" style="height:480px;display:flex;flex-direction:column"><span style="font:800 110px/1 var(--sans);letter-spacing:-.05em" class="g">0${i+1}</span><h4 style="margin-top:auto;font-size:32px;font-weight:800;letter-spacing:-.03em;margin-bottom:12px">${esc(t)}</h4><p style="font-size:19px;line-height:1.5;color:var(--ink2)">${esc(d)}</p></div>`).join('')}</div>`);

/* CIERRE */
add('dark end', `${img('IMG-20','', 'position:absolute;right:96px;top:72px;width:620px;height:560px;border-radius:28px')}${logoImg(LP,'position:absolute;left:96px;top:120px;width:420px')}
  <h1>¿Dudas con una pieza? Pregunta antes de publicarla.</h1>
  <div class="lines">${M.contacto.lineas.map(esc).join('<br>')}</div>
  <div class="sello">${esc(DOC)}<br>${esc(M.version||'')}</div>`);

/* armado */
const doc = document.getElementById('doc');
doc.innerHTML = pages.map((p,i)=>`<section class="pg ${p.cls}">${p.html.replace('{{P}}', String(i+1).padStart(2,'0'))}</section>`).join('');
document.title = `${DOC} · ${M.nombre}`;
document.querySelectorAll('.qr').forEach(el=>{
  if(typeof qrcode!=='function'){el.innerHTML='<div class="ph empty" style="width:100%;height:100%"><b>QR</b></div>';return;}
  const q = qrcode(0,'M'); q.addData(el.dataset.qr); q.make();
  el.innerHTML = q.createSvgTag({cellSize:8,margin:0,scalable:true}).replace('<svg ','<svg style="width:100%;height:100%" ');
});
window.MANUAL_LISTO = true;
})();
</script>
</body>
</html>
