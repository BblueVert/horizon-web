<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Visita HORIZON</title>
<meta name="description" content="Lo que HORIZON armó para tu negocio: web, agente y panel, y qué te conviene.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1A1626">
<link rel="icon" href="/Identidad/Logo%20ISO.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/hz-light.css">
<style>
  /* Visita en terreno: un solo recorrido en el celular de Benja. Web → agente → panel → radiografía → plan → siguiente paso. */
  :root { --e: #F2690C; --et: #FFE2CC; --p: #7B3FA0; --pt: #ECE3FF; --wa: #25D366; --wa-bg: #ECE5DD; --wa-me: #DCF8C6; }
  body { min-height: 100vh; display: flex; flex-direction: column; }
  .vt-top { background: var(--ink); color: #fff; position: sticky; top: 0; z-index: 20; padding-top: env(safe-area-inset-top, 0px); }
  .vt-top .wrap { height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .vt-top .logo img { height: 20px; width: auto; }
  .vt-top .biz { font: 500 12px var(--mono); color: #B9B3CC; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%; }
  .steps { display: flex; gap: 6px; overflow-x: auto; padding: 0 16px 10px; scrollbar-width: none; max-width: var(--wrap); margin: 0 auto; }
  .steps::-webkit-scrollbar { display: none; }
  .steps button { flex: none; font: 600 12px var(--font); color: #B9B3CC; background: rgba(255,255,255,.07); border: 0; border-radius: 99px; padding: 7px 11px; cursor: pointer; white-space: nowrap; }
  .steps button.on { background: #fff; color: var(--ink); }
  .steps button.done { color: #fff; }
  .steps button.done::before { content: '✓ '; color: #7EE2A8; }
  .steps button:disabled { opacity: .45; cursor: default; }

  main { flex: 1; }
  .scr { max-width: 640px; margin: 0 auto; padding: 22px max(16px, env(safe-area-inset-right, 0px)) 120px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 16px; }
  .kicker { font: 500 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); }
  .scr h1 { font-weight: 800; font-size: clamp(26px, 7vw, 38px); line-height: 1.08; letter-spacing: -.03em; text-wrap: balance; }
  .scr h1 span { color: var(--acc); }
  .scr h2 { font-weight: 800; font-size: 21px; letter-spacing: -.02em; line-height: 1.2; text-wrap: balance; }
  .scr p.lead { font-size: 16px; }
  .hint { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; font-size: 14px; color: var(--ink2); background: var(--bg2); border-radius: 14px; padding: 12px 14px; }
  .hint .ico { width: 18px; height: 18px; color: var(--acc); margin-top: 2px; }

  /* Bottom bar */
  .bb { position: fixed; inset: auto 0 0; z-index: 20; background: rgba(255,251,246,.94); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .bb .in { max-width: 640px; margin: 0 auto; display: flex; gap: 10px; }
  .bb .btn { flex: 1; justify-content: space-between; padding: 15px 18px; }
  .bb .btn-ghost { flex: none; }

  /* Flujo del sistema */
  .flow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; align-items: start; }
  .flow div { display: grid; justify-items: center; gap: 6px; text-align: center; font-size: 11.5px; font-weight: 600; color: var(--ink2); position: relative; }
  .flow div i { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); color: var(--ink2); }
  .flow div i .ico { width: 20px; height: 20px; }
  .flow div.on i { background: var(--acc); border-color: var(--acc); color: #fff; }
  .flow div:not(:last-child)::after { content: ''; position: absolute; top: 21px; left: calc(50% + 24px); right: calc(-50% + 24px); height: 2px; background: var(--line2); }

  /* Teléfono con la web */
  .phone { border-radius: 26px; border: 8px solid var(--ink); background: var(--ink); overflow: hidden; box-shadow: var(--shadow); max-width: 420px; width: 100%; margin: 0 auto; }
  .phone iframe { display: block; width: 100%; height: min(68vh, 720px); border: 0; background: #fff; }
  .ext { display: inline-flex; gap: 6px; align-items: center; font-weight: 700; font-size: 14px; color: var(--ink2); text-decoration: none; justify-self: center; }
  .ext .ico { width: 16px; height: 16px; }

  /* Chat tipo WhatsApp */
  .wachat { border-radius: 22px; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow); background: var(--wa-bg); display: grid; grid-template-rows: auto 1fr auto; height: min(64vh, 640px); }
  .wc-h { background: #075E54; color: #fff; display: flex; gap: 10px; align-items: center; padding: 10px 14px; }
  .wc-h b { display: block; font-size: 15px; } .wc-h small { font-size: 12px; color: #CFE9E4; }
  .wc-h .av { width: 34px; height: 34px; border-radius: 50%; background: var(--biz, #F2690C); display: grid; place-items: center; font-weight: 800; }
  .wc-b { overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: 82%; padding: 8px 11px; border-radius: 10px; font-size: 14.5px; line-height: 1.4; white-space: pre-wrap; box-shadow: 0 1px 1px rgba(0,0,0,.08); color: #111; }
  .msg.in { background: #fff; align-self: flex-start; border-top-left-radius: 2px; }
  .msg.out { background: var(--wa-me); align-self: flex-end; border-top-right-radius: 2px; }
  .msg.typing { color: #667; font-style: italic; }
  .msg.sys { align-self: center; background: #FFF3C4; font-size: 12.5px; max-width: 92%; text-align: center; }
  .wc-s { display: flex; gap: 6px; overflow-x: auto; padding: 8px 10px 0; scrollbar-width: none; }
  .wc-s::-webkit-scrollbar { display: none; }
  .wc-s button { flex: none; font: 600 13px var(--font); background: #fff; border: 1px solid #D5CFC6; border-radius: 99px; padding: 7px 11px; cursor: pointer; color: #075E54; }
  .wc-f { display: flex; gap: 8px; padding: 8px 10px 10px; background: var(--wa-bg); }
  .wc-f input { flex: 1; min-width: 0; font: 500 15px var(--font); border: 0; border-radius: 99px; padding: 11px 14px; background: #fff; color: #111; }
  .wc-f button { width: 44px; height: 44px; border-radius: 50%; border: 0; background: #075E54; color: #fff; display: grid; place-items: center; cursor: pointer; }
  .wc-f button .ico { width: 18px; height: 18px; }

  /* Panel */
  .pnl { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow); }
  .pnl-h { background: var(--ink); color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .pnl-h b { font-size: 14px; } .pnl-h small { font: 500 11px var(--mono); color: #B9B3CC; }
  .pnl-k { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--line); }
  .pnl-k div { padding: 12px 14px; display: grid; gap: 2px; } .pnl-k div + div { border-left: 1px solid var(--line); }
  .pnl-k small { font: 500 10.5px var(--mono); text-transform: uppercase; letter-spacing: .05em; color: var(--ink3); }
  .pnl-k b { font-size: 20px; font-variant-numeric: tabular-nums; }
  .lead-card { padding: 14px 16px; display: grid; gap: 8px; }
  .lead-card .top { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tag { font: 500 11px var(--mono); padding: 3px 8px; border-radius: 6px; text-transform: uppercase; letter-spacing: .04em; }
  .tag.new { background: var(--mint); color: #15803D; } .tag.wait { background: var(--bg2); color: var(--ink2); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
  .kv dt { color: var(--ink3); } .kv dd { margin: 0; font-weight: 600; }
  .aviso { background: var(--wa-bg); border-radius: 16px; padding: 12px; display: grid; gap: 6px; }
  .aviso small { font: 500 11px var(--mono); text-transform: uppercase; color: #54656F; letter-spacing: .05em; }
  .aviso .msg { max-width: 100%; }

  /* Radiografía */
  .opts { display: grid; gap: 10px; }
  .opt { text-align: left; font: 600 16px/1.35 var(--font); color: var(--ink); background: var(--surface); border: 1.5px solid var(--line2); border-radius: 16px; padding: 16px 18px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .opt.sel { border-color: var(--acc); background: #FFF6EF; }
  .opt .ico { width: 18px; height: 18px; color: var(--ink3); }
  .qprog { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .qprog i { display: block; height: 100%; background: var(--grad); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font: 600 15px var(--font); padding: 11px 14px; border-radius: 12px; border: 1.5px solid var(--line2); background: var(--surface); color: var(--ink); cursor: pointer; }
  .chip.sel { border-color: var(--acc); background: #FFF6EF; }
  .field { display: grid; gap: 6px; }
  .field label { font-weight: 700; font-size: 14px; }
  .field input, .field textarea { font: 500 16px var(--font); padding: 14px 15px; border-radius: 14px; border: 1.5px solid var(--line2); background: var(--surface); color: var(--ink); width: 100%; }
  .field textarea { min-height: 84px; resize: vertical; }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--acc); }
  .field small { color: var(--ink3); font-size: 13px; }
  .grid2 { display: grid; gap: 12px; }

  .leak { border-radius: 20px; padding: 18px; background: var(--grad-deep); color: #fff; display: grid; gap: 8px; }
  .leak small { font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: #E4DDF5; }
  .leak .big { font-weight: 800; font-size: clamp(32px, 10vw, 48px); letter-spacing: -.035em; line-height: 1; white-space: nowrap; }
  .leak .big span { display: block; margin-top: 6px; font-size: 15px; font-weight: 600; letter-spacing: 0; color: #E4DDF5; }
  .leak ul { list-style: none; display: grid; gap: 6px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.18); }
  .leak li { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: #F1ECF9; }
  .leak li b { font-family: var(--mono); font-weight: 500; white-space: nowrap; }
  .leak p { font-size: 12.5px; color: #CFC6E6; }

  .packs { display: grid; gap: 12px; }
  .pk { position: relative; text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 6px; cursor: pointer; font: inherit; color: inherit; }
  .pk.e { --c: var(--e); --ct: var(--et); } .pk.p { --c: var(--p); --ct: var(--pt); }
  .pk .nm { font-weight: 800; font-size: 22px; letter-spacing: -.02em; color: var(--c); }
  .pk .cl { font-size: 14px; font-weight: 600; color: var(--ink2); }
  .pk .pr { font-size: 14.5px; } .pk .pr b { font-size: 18px; }
  .pk ul { list-style: none; display: grid; gap: 4px; font-size: 13.5px; color: var(--ink2); margin-top: 4px; }
  .pk ul li::before { content: '✓ '; color: var(--c); font-weight: 700; }
  .pk .badge { position: absolute; top: 14px; right: 14px; font: 500 10.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 4px 8px; border-radius: 99px; background: var(--c); color: #fff; }
  .pk.rec { border-color: var(--c); }
  .pk.chosen { background: color-mix(in srgb, var(--ct) 45%, var(--surface)); box-shadow: 0 0 0 3px var(--ct); }
  .why { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 10px; }
  .why ol { list-style: none; display: grid; gap: 10px; counter-reset: m; }
  .why li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; font-size: 14.5px; counter-increment: m; }
  .why li::before { content: counter(m); width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font: 500 12px var(--mono); background: var(--bg2); color: var(--ink2); }
  .why li em { font-style: normal; font: 500 10.5px var(--mono); letter-spacing: .05em; text-transform: uppercase; margin-left: 6px; padding: 2px 6px; border-radius: 6px; white-space: nowrap; }
  .why li em.e { background: var(--et); color: #9A3D06; } .why li em.p { background: var(--pt); color: var(--p); }
  .notyet { border-radius: 18px; padding: 16px; background: var(--bg2); border: 1px dashed var(--line2); font-size: 15px; }

  .dec { display: grid; gap: 10px; }
  .dec button { text-align: left; border-radius: 18px; padding: 16px 18px; border: 1.5px solid var(--line2); background: var(--surface); cursor: pointer; font: inherit; color: var(--ink); display: grid; gap: 4px; }
  .dec button b { font-size: 17px; }
  .dec button span { font-size: 14px; color: var(--ink2); }
  .dec button.sel { border-color: var(--acc); background: #FFF6EF; }

  .steps-after { list-style: none; display: grid; gap: 10px; counter-reset: s; }
  .steps-after li { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; counter-increment: s; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 14.5px; }
  .steps-after li::before { content: counter(s); width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font: 500 13px var(--mono); background: var(--mint); color: #15803D; }
  .steps-after li small { display: block; color: var(--ink3); font-size: 13px; }
  .err { background: #FDE8E8; color: #9B1C1C; border-radius: 12px; padding: 12px 14px; font-size: 14px; }
  .wa-btn { background: var(--wa); color: #fff; }
  .note { font-size: 13px; color: var(--ink3); }
  .hub { display: grid; gap: 10px; }
  .hc { display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: center; padding: 16px; border-radius: 18px; background: var(--surface); border: 1.5px solid var(--line2); text-decoration: none; color: var(--ink); }
  .hc .n { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; background: var(--bg2); color: var(--acc); }
  .hc .n .ico { width: 22px; height: 22px; }
  .hc b { display: block; font-size: 17px; letter-spacing: -.01em; }
  .hc small { display: block; font-size: 13.5px; color: var(--ink2); line-height: 1.35; margin-top: 2px; }
  .hc > .ico { width: 18px; height: 18px; color: var(--ink3); }
  .hc.done { border-color: #BFE8CF; background: #F4FBF6; }
  .hc.done .n { background: var(--mint); color: var(--ok); }
  .hc.off { opacity: .5; pointer-events: none; }
  @media (min-width: 640px) { .grid2 { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<header class="vt-top">
  <div class="wrap">
    <a href="/terreno" class="logo" aria-label="HORIZON"><img src="/Identidad/Logo%20HORIZON.svg" alt="HORIZON" width="104" height="20"></a>
    <span class="biz" id="biz">Visita</span>
  </div>
  <nav class="steps" id="steps" aria-label="Pasos de la visita"></nav>
</header>
<main id="app" aria-live="polite"></main>
<div class="bb" id="bb"></div>

<script src="/Pages/visita/visitas.js"></script>
<script src="/shared/hz-radiografia.js"></script>
<script>
(function () {
  var R = window.HZRX, PACK = R.PACK, Q = R.Q, clp = R.clp;
  var SPRITE = '/shared/hz-sprite.svg#';
  var slug = (location.pathname.split('/').filter(Boolean)[1] || new URLSearchParams(location.search).get('n') || '').toLowerCase().replace(/[^a-z0-9-]/g, '');
  var V = (window.HZ_VISITAS || {})[slug] || null;
  var MODO = new URLSearchParams(location.search).get('paso') || '';

  var PASOS = [
    { id: 'web', t: 'Tu web' }, { id: 'agente', t: 'Tu agente' }, { id: 'panel', t: 'Tu panel' },
    { id: 'rx', t: 'Radiografía' }, { id: 'plan', t: 'Tu plan' }, { id: 'cierre', t: 'Siguiente paso' }
  ];
  var st = { paso: 0, max: 0, chat: [], hist: [], accion: null, aviso: null, enviando: false,
    qi: 0, r: {}, ticket: 0, elegido: null, decision: null,
    nombre: '', tel: '', email: '', rut: '', razon: '', dir: '', notas: '', err: '', guardado: null, portal: '' };

  var app = document.getElementById('app'), bb = document.getElementById('bb'), stepsEl = document.getElementById('steps');
  function ico(n) { return '<svg class="ico"><use href="' + SPRITE + n + '"/></svg>'; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function negocio() { return V ? V.nombre : 'tu negocio'; }

  function renderSteps() {
    var vis = MODO === 'demo' ? [1, 2] : null;
    stepsEl.innerHTML = PASOS.map(function (p, i) {
      if (vis && vis.indexOf(i) < 0) return '';
      return '<button data-go="' + i + '" class="' + (i === st.paso ? 'on' : (i < st.max || i < st.paso ? 'done' : '')) + '"' + (i > st.max ? ' disabled' : '') + '>' + (i + 1) + '. ' + p.t + '</button>';
    }).join('');
    var on = stepsEl.querySelector('.on'); if (on && on.scrollIntoView) on.scrollIntoView({ inline: 'center', block: 'nearest' });
  }
  function bar(back, nextLabel, nextAct, extra) {
    bb.innerHTML = '<div class="in">' +
      (back ? '<button class="btn btn-ghost" data-act="prev" aria-label="Atrás">' + ico('i-chev-l') + '</button>' : '') +
      (nextLabel ? '<button class="btn ' + (extra || 'btn-acc') + '" data-act="' + nextAct + '">' + nextLabel + ' ' + ico('i-arrow') + '</button>' : '') +
      '</div>';
    bb.hidden = !back && !nextLabel;
  }
  function go(i) { st.paso = i; st.max = Math.max(st.max, i); render(); window.scrollTo(0, 0); }

  function flowStrip(on) {
    var it = [['i-search', 'Instagram y Google'], ['i-web', 'Web'], ['i-chat', 'WhatsApp'], ['i-agent', 'Agente'], ['i-panel', 'Panel']];
    return '<div class="flow" aria-label="Recorrido del cliente">' + it.map(function (x, i) { return '<div class="' + (on.indexOf(i) >= 0 ? 'on' : '') + '"><i>' + ico(x[0]) + '</i>' + x[1] + '</div>'; }).join('') + '</div>';
  }

  /* ---------- Pantallas ---------- */
  function scrWeb() {
    var h = '<section class="scr">' +
      '<span class="kicker">Paso 1 · ' + esc(V ? V.rubro : '') + '</span>' +
      '<h1>Armé esto pensando en <span>' + esc(negocio()) + '</span></h1>' +
      '<p class="lead">Así te encuentra un cliente: te ve en Instagram o Google, entra a tu web y te escribe. Mira tu web como la vería él.</p>' +
      flowStrip([0, 1]);
    if (V && V.web) {
      h += '<div class="phone"><iframe src="' + esc(V.web) + '" title="Web demo de ' + esc(negocio()) + '" loading="eager"></iframe></div>' +
        '<a class="ext" href="' + esc(V.web) + '" target="_blank" rel="noopener">Abrir en pantalla completa ' + ico('i-ext') + '</a>';
    } else {
      h += '<div class="hint">' + ico('i-web') + '<span>Este negocio todavía no tiene web demo. Pasa directo a su agente.</span></div>';
    }
    h += '</section>';
    app.innerHTML = h;
    bar(false, 'Ahora, tu agente', 'next');
  }

  function scrAgente() {
    var h = '<section class="scr"><span class="kicker">Paso 2 · Tu agente</span>' +
      '<h1>Escríbele como si fueras un cliente</h1>' + flowStrip([2, 3]);
    if (V && V.chat) {
      h += '<p class="lead">Pregúntale lo que te preguntan todos los días, y después pide algo. Responde con tus precios y horarios reales.</p>' +
        '<div class="wachat" style="--biz:' + esc(V.color || '#F2690C') + '">' +
          '<div class="wc-h"><span class="av">' + esc(negocio().charAt(0)) + '</span><div><b>' + esc(negocio()) + '</b><small>en línea</small></div></div>' +
          '<div class="wc-b" id="waB"></div>' +
          '<div><div class="wc-s">' + (V.sugerencias || []).map(function (s) { return '<button data-sug="' + esc(s) + '">' + esc(s) + '</button>'; }).join('') + '</div>' +
          '<form class="wc-f" id="waF"><input id="waI" autocomplete="off" placeholder="Escribe un mensaje" aria-label="Mensaje"><button aria-label="Enviar">' + ico('i-arrow') + '</button></form></div>' +
        '</div>';
    } else if (V && V.chatEnWeb) {
      h += '<p class="lead">Toca el botón de chat en la web y pídele algo. Es el mismo agente que contesta el WhatsApp.</p>' +
        '<div class="phone"><iframe src="' + esc(V.web) + '" title="Agente de ' + esc(negocio()) + '"></iframe></div>';
    } else {
      h += '<div class="hint">' + ico('i-agent') + '<span>No encontré el agente de este negocio. Revisa que la demo esté publicada con "web": true.</span></div>';
    }
    h += '</section>';
    app.innerHTML = h;
    if (V && V.chat) { pintarChat(); }
    bar(MODO !== 'demo', st.accion || (V && V.chatEnWeb) ? 'Mira dónde quedó' : 'Ver el panel', 'next');
  }

  function pintarChat() {
    var b = document.getElementById('waB'); if (!b) return;
    if (!st.chat.length) st.chat.push({ k: 'sys', t: 'Demo armada por HORIZON con los datos públicos de ' + negocio() + '.' });

  function leerDatos() {
    function v(id) { var e = document.getElementById(id); return e ? e.value.trim() : null; }

  }

  function guardar() {
    leerDatos();
    var p = st.decision === 'partimos';
    if (!st.nombre) { st.err = 'Falta el nombre.'; return render(); }
    if (R.normPhone(st.tel).length < 11) { st.err = 'Revisa el WhatsApp: 9 dígitos, partiendo con 9.'; return render(); }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(st.email)) { st.err = 'Revisa el correo.'; return render(); }
    if (p && !st.rut) { st.err = 'Para el contrato falta el RUT.'; return render(); }
    st.err = ''; st.enviando = true; render();
    var c = R.calc(st.r, st.ticket);
    var conv = st.hist.map(function (m) { return (m.role === 'user' ? 'Cliente: ' : 'Agente: ') + m.content; }).join(' | ');
    var payload = {
      nombre: st.nombre, email: st.email, empresa: negocio(), telefono: '+' + R.normPhone(st.tel),
      mensaje: 'Visita en terreno. Recomendado: ' + c.rec + '. Elegido: ' + st.elegido + '. Decisión: ' + st.decision + '. Se le escapan ≈ ' + clp(c.total) + '/mes.' + (st.notas ? ' Notas: ' + st.notas : ''),
      fuente: 'terreno', origen: 'terreno-visita',
      radiografia: {
        negocio_slug: slug, respuestas: st.r, ticket: st.ticket, escape_mes: c.total, puntos_e: c.e, puntos_p: c.p,
        recomendado: c.rec, elegido: st.elegido, decision: st.decision,
        mejoras: c.mejoras.map(function (m) { return m[0]; }),
        resumen: R.resumen({ nombre: st.nombre, negocio: negocio(), elegido: st.elegido, decision: st.decision }, c),
        conversacion: (st.accion && st.accion.resumen ? 'Demo: ' + st.accion.resumen + ' | ' : '') + conv,
        notas: st.notas,
        contrato: p ? { rut: st.rut, razon_social: st.razon, direccion: st.dir } : null
      }
    };
    fetch('/api/leads', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || r.status); return j; }); })
      .then(function (j) { st.portal = j.portal || ''; })
      .catch(function () { st.err = 'No se pudo guardar en OPS (sin señal o error del servidor). Manda igual la radiografía por WhatsApp y anota el lead a mano.'; })
      .then(function () { st.enviando = false; st.guardado = true; render(); });
  }

  document.addEventListener('click', function (ev) {
    var hb = ev.target.closest('[data-hub]');
    if (hb) { marcar(hb.getAttribute('data-hub')); setTimeout(scrHub, 300); return; }
    var t = ev.target.closest('[data-go],[data-act],[data-sug],[data-ans],[data-tk],[data-pick],[data-dec]'); if (!t) return;
    if (t.getAttribute('data-act') === 'resetHub') { try { localStorage.removeItem('visita:' + slug); } catch (e) {} scrHub(); return; }
    if (t.hasAttribute('data-go')) { var i = +t.getAttribute('data-go'); if (i <= st.max && !st.guardado) go(i); return; }
    if (t.hasAttribute('data-sug')) { enviar(t.getAttribute('data-sug')); return; }
    if (t.hasAttribute('data-ans')) { st.r[Q[st.qi].id] = t.getAttribute('data-ans'); st.qi++; render(); window.scrollTo(0, 0); return; }
    if (t.hasAttribute('data-tk')) { st.ticket = +t.getAttribute('data-tk'); render(); return; }
    if (t.hasAttribute('data-pick')) { st.elegido = t.getAttribute('data-pick'); render(); return; }
    if (t.hasAttribute('data-dec')) { st.decision = t.getAttribute('data-dec'); render(); return; }
    var a = t.getAttribute('data-act');
    if (a === 'next') go(st.paso + 1);
    else if (a === 'prev') {
      if (st.paso === 3 && st.qi > 0) { st.qi--; render(); }
      else if (st.paso === 5 && !st.guardado) { leerDatos(); st.err = ''; go(4); }
      else go(Math.max(0, st.paso - 1));
    }
    else if (a === 'toPlan') {
      var tk = document.getElementById('tk'); var v = tk ? +String(tk.value).replace(/\D/g, '') : 0;
      if (v > 0) st.ticket = v;
      if (!st.ticket) { tk.focus(); tk.placeholder = 'Elige un monto o escríbelo'; return; }
      st.elegido = null; go(4);
    }
    else if (a === 'save') { if (!st.enviando) guardar(); }
  });

    if (ev.target.id === 'waF') { ev.preventDefault(); var i = document.getElementById('waI'); enviar(i.value); i.value = ''; }
  });

  if (MODO === 'demo') { st.paso = 1; st.max = 2; }
  // Negocio sin entrada en visitas.js: se intenta con su demo publicada (solo agente).
  if (!V && slug) {
    fetch('/api/demo-chat?slug=' + encodeURIComponent(slug)).then(function (r) { return r.ok ? r.json() : null; }).then(function (f) {
      if (f) { V = { nombre: f.nombre, rubro: '', color: f.color, web: null, chat: slug, sugerencias: [] }; render(); }
    }).catch(function () {});
  }
  render();
})();
</script>
