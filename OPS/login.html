<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>HORIZON OPS · Acceso</title>
<link rel="icon" type="image/png" href="/Identidad/Logo ISO.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="/OPS/shared/ops.css">
<script src="/shared/hz-icons.js"></script>
<style>
[hidden]{display:none!important;}
html,body{height:100%;overflow:auto;}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;
  background:radial-gradient(ellipse at 30% 20%,rgba(255,107,53,.08) 0%,transparent 60%),#0a0914;}
.login-wrap{width:100%;max-width:400px;padding:24px 16px;}
.login-card{background:var(--card);border:1px solid var(--border2);border-radius:18px;padding:34px 28px;}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:30px;}
.login-logo img{height:26px;}
.login-logo-badge{font-size:12px;font-weight:600;letter-spacing:.6px;color:var(--h1);}
.login-title{font-size:24px;font-weight:700;letter-spacing:-.2px;color:var(--text);margin-bottom:6px;}
.login-sub{font-size:14px;color:var(--text2);margin-bottom:24px;line-height:1.5;}
.login-sub strong{color:var(--text);font-weight:600;}
.ops-input{font-size:16px;padding:12px 14px;}
.code-input{letter-spacing:10px;font-size:26px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;padding:12px 8px;}
.btn-full{width:100%;justify-content:center;padding:13px;font-size:15px;margin-top:6px;}
.msg{display:flex;gap:8px;align-items:flex-start;border-radius:10px;padding:11px 12px;font-size:13.5px;line-height:1.45;margin-top:14px;}
.msg .hz-i{font-size:17px;flex-shrink:0;margin-top:1px;}
.msg.err{background:rgba(239,68,68,.1);color:#fca5a5;border:1px solid rgba(239,68,68,.2);}
.msg.ok{background:rgba(16,185,129,.1);color:#6ee7b7;border:1px solid rgba(16,185,129,.2);}
.links{display:flex;justify-content:space-between;gap:12px;margin-top:18px;}
.link{background:none;border:0;color:var(--text2);font-size:13.5px;font-weight:600;cursor:pointer;padding:0;font-family:inherit;display:inline-flex;align-items:center;gap:6px;}
.link:hover{color:var(--text);}
.link:disabled{opacity:.45;cursor:default;}
</style>
</head>
<body class="ops-dark">
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <img src="/Identidad/Logo-Vertical-png.png" alt="HORIZON">
      <span class="login-logo-badge">OPS</span>
    </div>

    <!-- Paso 1: correo -->
    <form id="stepEmail" novalidate>
      <div class="login-title">Entrar</div>
      <p class="login-sub">Escribe tu correo del equipo. Te enviamos un código para entrar, sin contraseña.</p>
      <div class="ops-field">
        <label class="ops-label" for="email">Correo</label>
        <input class="ops-input" type="email" id="email" placeholder="tu@correo.com" required autocomplete="email" inputmode="email" autofocus>
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="btnSend"><i class="hz-i" data-i="send"></i><span>Enviarme el código</span></button>
    </form>

    <!-- Paso 2: código -->
    <form id="stepCode" novalidate hidden>
      <div class="login-title">Revisa tu correo</div>
      <p class="login-sub">Enviamos un código a <strong id="sentTo"></strong>. Escríbelo aquí o toca el link del correo.</p>
      <div class="ops-field">
        <label class="ops-label" for="code">Código</label>
        <input class="ops-input code-input" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="••••••" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="btnVerify"><i class="hz-i" data-i="check"></i><span>Entrar</span></button>
      <div class="links">
        <button type="button" class="link" id="btnBack"><i class="hz-i" data-i="arrow-up" style="transform:rotate(-90deg)"></i>Otro correo</button>
        <button type="button" class="link" id="btnResend">Reenviar código</button>
      </div>
    </form>

    <div id="msg" role="status" aria-live="polite"></div>
  </div>
</div>
<script src="/OPS/shared/ops-auth.js"></script>
<script>
(async function(){
  const sb = getSB();
  const $ = id => document.getElementById(id);
  const show = (text, kind = 'err') => { $('msg').innerHTML = text ? `<div class="msg ${kind}"><i class="hz-i" data-i="${kind === 'ok' ? 'check-circle' : 'alert'}"></i><span>${opsEsc(text)}</span></div>` : ''; };
  const busy = (btn, on, label) => { btn.disabled = on; btn.querySelector('span').textContent = label; };

  // Entra solo si la cuenta está en ops_admins; si no, cierra la sesión (evita un bucle login ↔ /ops)
  async function enterIfAdmin(){
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return false;
    const { data: isAdmin } = await sb.rpc('is_ops_admin');
    if (isAdmin === true) { location.replace('/ops'); return true; }
    await sb.auth.signOut();
    show('Este correo no tiene acceso a HORIZON OPS.');
    return false;
  }

  // También cubre la vuelta desde el link del correo (la sesión llega en la URL)
  if (await enterIfAdmin()) return;
  if (new URLSearchParams(location.search).get('e') === 'forbidden') show('Este correo no tiene acceso a HORIZON OPS.');

  let email = '', cooldown = 0, timer;
  function startCooldown(){
    cooldown = 60; $('btnResend').disabled = true; $('btnResend').textContent = 'Reenviar en 60s';
    clearInterval(timer);
    timer = setInterval(() => {
      cooldown--; $('btnResend').textContent = cooldown > 0 ? `Reenviar en ${cooldown}s` : 'Reenviar código';
      if (cooldown <= 0) { clearInterval(timer); $('btnResend').disabled = false; }
    }, 1000);
  }

  async function sendCode(){
    const { error } = await sb.auth.signInWithOtp({
      email,
      options: { shouldCreateUser: false, emailRedirectTo: location.origin + '/ops/login' },
    });
    if (!error) return true;
    const m = (error.message || '').toLowerCase();
    if (m.includes('signup') || m.includes('not found') || m.includes('not allowed')) show('Este correo no tiene acceso a HORIZON OPS.');
    else if (error.status === 429 || m.includes('rate') || m.includes('seconds')) show('Pediste varios códigos seguidos. Espera un minuto y vuelve a intentar.');
    else show('No pudimos enviar el código. Intenta de nuevo en un momento.');
    return false;
  }

  $('stepEmail').addEventListener('submit', async e => {
    e.preventDefault(); show('');
    email = $('email').value.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return show('Escribe un correo válido.');
    busy($('btnSend'), true, 'Enviando…');
    const ok = await sendCode();
    busy($('btnSend'), false, 'Enviarme el código');
    if (!ok) return;
    $('sentTo').textContent = email;
    $('stepEmail').hidden = true; $('stepCode').hidden = false;
    $('code').value = ''; $('code').focus(); startCooldown();
  });

  $('code').addEventListener('input', e => {
    e.target.value = e.target.value.replace(/\D/g, '');
    if (e.target.value.length === 6) $('stepCode').requestSubmit();
  });

  $('stepCode').addEventListener('submit', async e => {
    e.preventDefault(); show('');
    const token = $('code').value.trim();
    if (!/^\d{6,10}$/.test(token)) return show('El código tiene 6 dígitos.');
    busy($('btnVerify'), true, 'Entrando…');
    const { error } = await sb.auth.verifyOtp({ email, token, type: 'email' });
    if (error) {
      busy($('btnVerify'), false, 'Entrar');
      $('code').select();
      return show(/expired/i.test(error.message || '') ? 'El código venció. Pide uno nuevo.' : 'El código no es correcto. Revisa el correo más reciente.');
    }
    if (!(await enterIfAdmin())) { busy($('btnVerify'), false, 'Entrar'); $('stepCode').hidden = true; $('stepEmail').hidden = false; }
  });

  $('btnResend').addEventListener('click', async () => {
    show(''); if (await sendCode()) { show('Te enviamos un código nuevo.', 'ok'); startCooldown(); }
  });
  $('btnBack').addEventListener('click', () => {
    show(''); clearInterval(timer); $('btnResend').disabled = false; $('btnResend').textContent = 'Reenviar código';
    $('stepCode').hidden = true; $('stepEmail').hidden = false; $('email').focus();
  });
})();
</script>
</body>
</html>
