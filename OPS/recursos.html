<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>HORIZON OPS · Recursos</title>
<link rel="icon" type="image/png" href="../Identidad/Logo ISO.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="/OPS/shared/ops.css">
<style>
.rs-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px;}
.rs-stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;}
.rs-stat b{display:block;font-size:24px;font-weight:700;color:var(--text);}
.rs-stat span{font-size:12px;color:var(--text3);}
.rs-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.rs-chip{border:1px solid var(--border2);background:var(--card);color:var(--text2);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;}
.rs-chip.on{border-color:var(--h1);color:var(--h1-ink);background:var(--h1-soft);}
.rs-search{flex:1;min-width:180px;background:var(--card);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-family:var(--fb);font-size:13px;padding:8px 12px;outline:none;}
.rs-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:auto;}
.ops-table tr{cursor:pointer;}
.rs-neg{font-weight:600;color:var(--text);}
.rs-sub{font-size:11px;color:var(--text3);}
.rs-kw{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--h1-ink);}
.rs-niv{display:inline-block;font-size:11px;font-weight:700;border-radius:10px;padding:2px 8px;}
.n-urgente{background:rgba(220,38,38,.12);color:var(--red);}.n-en{background:rgba(184,117,3,.14);color:var(--yellow);}.n-solido{background:rgba(15,159,110,.13);color:var(--green);}
.rs-panel-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:50;}
.rs-panel{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--panel);border-left:1px solid var(--border);z-index:51;overflow:auto;padding:22px;transform:translateX(100%);transition:transform .2s;}
.rs-panel.open{transform:none;}.rs-panel-bg.open{display:block;}
.rs-panel h3{font-size:18px;margin:2px 0 4px;}
.rs-sec{margin-top:18px;}
.rs-sec h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-bottom:8px;}
.rs-concl{background:var(--h1-soft);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.6;color:var(--text);}
.rs-qa{border-bottom:1px solid var(--border);padding:8px 0;font-size:13px;}
.rs-qa div:first-child{color:var(--text3);font-size:12px;}
.rs-qa div:last-child{color:var(--text);white-space:pre-wrap;}
.rs-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.rs-acts a{text-decoration:none;}
</style>
</head>
<body>
<div class="ops-layout">
  <main class="ops-main">
    <div class="ops-header">
      <div><div class="ops-page-title">Recursos</div><div class="ops-page-sub" id="rsSub">Respuestas de horizonweb.cl/recursos</div></div>
      <div class="ops-header-actions"><a class="btn btn-ghost btn-sm" href="/recursos" target="_blank" rel="noopener">Ver recursos ↗</a></div>
    </div>
    <div class="ops-content">
      <div class="rs-stats" id="rsStats"></div>
      <div class="rs-toolbar" id="rsToolbar"></div>
      <div id="rsLoading" class="ops-loading"><div class="ops-spinner"></div></div>
      <div class="rs-wrap" id="rsWrap" style="display:none;">
        <table class="ops-table"><thead><tr><th>Fecha</th><th>Negocio</th><th>Recurso</th><th>Resultado</th><th>Plan sugerido</th><th>Contacto</th></tr></thead><tbody id="rsBody"></tbody></table>
      </div>
    </div>
  </main>
</div>
<div class="rs-panel-bg" id="rsBg" onclick="closePanel()"></div>
<aside class="rs-panel" id="rsPanel"></aside>

<script src="/OPS/shared/ops-auth.js"></script>
<script src="/OPS/shared/ops-nav.js"></script>
<script>
const PLANES = { plan01:'Plan 01 · Presencia Digital', plan02:'Plan 02 · Ecosistema Digital', plan04:'Plan 03 · Sistema con IA', plan05:'Plan 04 · Agente IA', plan03:'Negocio Activo (anterior)' };
let ROWS = [], DEFS = {}, filtro = '', q = '';
const e = s => opsEsc(s == null ? '' : String(s));
const fecha = d => new Date(d).toLocaleString('es-CL', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
const nivelCls = n => n === 'urgente' ? 'n-urgente' : n === 'en camino' ? 'n-en' : 'n-solido';
const waLink = t => t ? 'https://wa.me/' + String(t).replace(/\D/g, '') : '';

async function load(){
  const sb = getSB();
  const [{ data, error }, lista] = await Promise.all([
    sb.from('resource_responses')
      .select('id,token,recurso,negocio,rubro,comuna,respuestas,resultado,puntaje,nivel,plan_sugerido,origen,created_at,lead:leads(id,nombre,telefono,email,status)')
      .order('created_at', { ascending: false }).limit(500),
    fetch('/api/recursos').then(r => r.json()).catch(() => []),
  ]);
  document.getElementById('rsLoading').style.display = 'none';
  if (error) { document.getElementById('rsWrap').style.display = 'block'; document.getElementById('rsBody').innerHTML = `<tr><td colspan="6">Error: ${e(error.message)}. ¿Corriste la migración 012?</td></tr>`; return; }
  ROWS = data || [];
  await Promise.all((lista || []).map(async d => { DEFS[d.slug] = await fetch('/api/recursos?slug=' + d.slug).then(r => r.json()).catch(() => d); }));
  toolbar(); render();
}

function toolbar(){
  const cuenta = s => ROWS.filter(r => r.recurso === s).length;
  document.getElementById('rsToolbar').innerHTML =
    `<button class="rs-chip${filtro===''?' on':''}" onclick="setF('')">Todos (${ROWS.length})</button>` +
    Object.values(DEFS).map(d => `<button class="rs-chip${filtro===d.slug?' on':''}" onclick="setF('${d.slug}')">${e(d.kw)} (${cuenta(d.slug)})</button>`).join('') +
    `<input class="rs-search" placeholder="Buscar negocio, rubro, comuna…" value="${e(q)}" oninput="q=this.value;render()">`;
}
function setF(s){ filtro = s; toolbar(); render(); }

function render(){
  const t = q.trim().toLowerCase();
  const rows = ROWS.filter(r => (!filtro || r.recurso === filtro) &&
    (!t || [r.negocio, r.rubro, r.comuna, r.lead?.nombre].join(' ').toLowerCase().includes(t)));
  const conPuntaje = rows.filter(r => r.puntaje != null);
  const prom = conPuntaje.length ? Math.round(conPuntaje.reduce((s, r) => s + r.puntaje, 0) / conPuntaje.length) : '—';
  const leads = new Set(rows.map(r => r.lead?.id).filter(Boolean)).size;
  const semana = rows.filter(r => Date.now() - new Date(r.created_at) < 7 * 864e5).length;
  const conPlan = rows.filter(r => r.plan_sugerido).length;
  document.getElementById('rsStats').innerHTML = [
    [rows.length, 'respuestas'], [leads, 'leads únicos'], [semana, 'últimos 7 días'], [prom, 'puntaje promedio'], [conPlan, 'con plan sugerido'],
  ].map(([b, s]) => `<div class="rs-stat"><b>${b}</b><span>${s}</span></div>`).join('');
  document.getElementById('rsSub').textContent = `${rows.length} respuestas · ${leads} leads`;
  document.getElementById('rsWrap').style.display = 'block';
  document.getElementById('rsBody').innerHTML = rows.length ? rows.map(r => `
    <tr onclick="openPanel('${r.id}')">
      <td>${fecha(r.created_at)}</td>
      <td><div class="rs-neg">${e(r.negocio)}</div><div class="rs-sub">${e([r.rubro, r.comuna].filter(Boolean).join(' · '))}</div></td>
      <td><span class="rs-kw">${e(DEFS[r.recurso]?.kw || r.recurso)}</span></td>
      <td>${r.puntaje != null ? `<b>${r.puntaje}</b>/100 ` : ''}${r.nivel ? `<span class="rs-niv ${nivelCls(r.nivel)}">${e(r.nivel)}</span>` : (r.resultado?.titular ? e(r.resultado.titular) : '—')}</td>
      <td>${e(PLANES[r.plan_sugerido] || '—')}</td>
      <td>${e(r.lead?.nombre || '—')}<div class="rs-sub">${e(r.lead?.telefono || '')}</div></td>
    </tr>`).join('') : `<tr><td colspan="6"><div class="ops-empty">Todavía no hay respuestas${filtro ? ' para este recurso' : ''}.</div></td></tr>`;
}

function valor(c, v){
  if (c?.tipo === 'check') return v ? '✓ Sí' : '✕ No';
  if (c?.tipo === 'opcion') return (c.opciones || []).find(o => o.v === v)?.l || v || '—';
  return v || '—';
}

function openPanel(id){
  const r = ROWS.find(x => x.id === id); if (!r) return;
  const def = DEFS[r.recurso] || { campos: [] };
  const res = r.resultado || {};
  const link = location.origin + '/recursos/r/' + r.token;
  const tel = r.lead?.telefono;
  const msg = `Hola ${r.lead?.nombre || ''}, soy Benjamín de HORIZON. Vi tu resultado del recurso ${def.kw || r.recurso} para ${r.negocio}. ¿Te parece si lo conversamos 15 minutos?`;
  document.getElementById('rsPanel').innerHTML = `
    <button class="btn btn-ghost btn-sm" onclick="closePanel()" style="float:right">Cerrar</button>
    <div class="rs-kw">${e(def.kw || r.recurso)} · ${fecha(r.created_at)}</div>
    <h3>${e(r.negocio)}</h3>
    <div class="rs-sub">${e([r.rubro, r.comuna].filter(Boolean).join(' · '))}</div>
    <div class="rs-sec"><h4>Resultado</h4>
      <div style="font-weight:700;font-size:15px;">${e(res.titular || '')}</div>
      ${r.plan_sugerido ? `<div class="rs-sub" style="margin-top:4px">Plan sugerido: ${e(PLANES[r.plan_sugerido] || r.plan_sugerido)}</div>` : ''}
      ${res.datos?.comision_mes ? `<div class="rs-sub">Comisión apps estimada: $${Number(res.datos.comision_mes).toLocaleString('es-CL')}/mes · ahorro posible: $${Number(res.datos.ahorro_mes).toLocaleString('es-CL')}/mes</div>` : ''}
    </div>
    ${res.conclusion ? `<div class="rs-sec"><h4>Conclusión entregada</h4><div class="rs-concl">${e(res.conclusion)}</div></div>` : ''}
    ${(res.acciones || []).length ? `<div class="rs-sec"><h4>Prioridades</h4>${res.acciones.map((a, i) => `<div class="rs-qa"><div>${i + 1}</div><div>${e(a)}</div></div>`).join('')}</div>` : ''}
    <div class="rs-sec"><h4>Respuestas</h4>${(def.campos || []).map(c => `<div class="rs-qa"><div>${e(c.label)}</div><div>${e(valor(c, r.respuestas?.[c.id]))}</div></div>`).join('')}</div>
    <div class="rs-sec"><h4>Lead</h4>
      <div>${e(r.lead?.nombre || '—')} · ${e(r.lead?.status || '')}</div>
      <div class="rs-sub">${e(tel || '')} ${r.lead?.email ? '· ' + e(r.lead.email) : ''}</div>
      ${r.origen && Object.keys(r.origen).length ? `<div class="rs-sub">Origen: ${e(Object.entries(r.origen).map(([k, v]) => k + '=' + v).join(' · '))}</div>` : ''}
      <div class="rs-acts">
        ${tel ? `<a class="btn btn-primary btn-sm" target="_blank" rel="noopener" href="${waLink(tel)}?text=${encodeURIComponent(msg)}">WhatsApp</a>` : ''}
        <a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" href="${link}">Ver resultado ↗</a>
        <a class="btn btn-ghost btn-sm" href="/ops/pipeline">Ir al pipeline</a>
      </div>
    </div>`;
  document.getElementById('rsPanel').classList.add('open');
  document.getElementById('rsBg').classList.add('open');
}
function closePanel(){ document.getElementById('rsPanel').classList.remove('open'); document.getElementById('rsBg').classList.remove('open'); }
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closePanel(); });

(async function(){ const session = await opsRequireAuth(); if (!session) return; await opsInitNav(); await load(); })();
</script>
</body>
</html>
